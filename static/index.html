<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#06080e">
<title>CASEFORGE — бесплатные кейсы CS2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/oswald@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/oswald@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/oswald@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/oswald@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/exo-2@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/exo-2@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/russo-one@5/400.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#06080e;--panel:#101521;--panel2:#151c2a;--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.14);
--txt:#e9edf6;--mut:#8792a6;--mut2:#5f6a7d;
--gold:#ffb62e;--cyan:#22d3ee;--pink:#ff2fb9;--green:#3ddc84;--red:#ff4d5e;
--sh:0 18px 50px -12px rgba(0,0,0,.85);--sab:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:'Exo 2',system-ui,sans-serif;font-size:15px;line-height:1.45;overflow-x:hidden;overscroll-behavior-y:none}
h1,h2,h3,.dsp{font-family:'Oswald',sans-serif;letter-spacing:.02em}
.mono{font-family:'Russo One',sans-serif}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
input,select{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#0a0d15}
::-webkit-scrollbar-thumb{background:#232c3d;border-radius:6px;border:2px solid #0a0d15}
html.is-mobile ::-webkit-scrollbar{width:0;height:0}

#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgfx .orb{position:absolute;border-radius:50%;opacity:.28;animation:orbFloat 24s ease-in-out infinite;will-change:transform}
#bgfx .o1{width:620px;height:620px;background:radial-gradient(circle,#1b3cff 0%,transparent 68%);top:-220px;left:-160px}
#bgfx .o2{width:520px;height:520px;background:radial-gradient(circle,#12a860 0%,transparent 68%);bottom:-200px;right:-120px;animation-delay:-7s;opacity:.18}
#bgfx .o3{width:460px;height:460px;background:radial-gradient(circle,#00e5ff 0%,transparent 68%);top:38%;left:52%;animation-delay:-14s;opacity:.13}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-40px) scale(1.08)}66%{transform:translate(-40px,50px) scale(.94)}}
#bgfx .grid{position:absolute;inset:-2px;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse 100% 70% at 50% 0%,#000 20%,transparent 78%)}

header{position:sticky;top:0;z-index:200;background:rgba(6,8,14,.96);border-bottom:1px solid var(--line)}
.hwrap{max-width:1560px;margin:0 auto;padding:0 22px;height:70px;display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:11px;flex-shrink:0;cursor:pointer}
.logo .mark{width:40px;height:40px}
.logo .mark svg{width:100%;height:100%;filter:drop-shadow(0 0 10px rgba(255,182,46,.55))}
.logo .txt{font-family:'Russo One';font-size:19px;line-height:1;letter-spacing:.06em}
.logo .txt b{color:var(--gold)}
.logo .txt span{display:block;font-family:'Exo 2';font-size:8.5px;letter-spacing:.34em;color:var(--mut2);margin-top:4px}
nav{display:flex;gap:2px;margin-left:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{position:relative;padding:10px 12px;border-radius:10px;font-family:'Oswald';font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);transition:.2s;font-weight:500;white-space:nowrap;flex-shrink:0}
nav button:hover{color:#fff;background:rgba(255,255,255,.05)}
nav button.on{color:#fff;background:linear-gradient(180deg,rgba(255,182,46,.16),rgba(255,182,46,.05))}
nav button.on::after{content:'';position:absolute;left:10px;right:10px;bottom:3px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
nav button.adm{color:#ff8b96}
nav button.adm.on{background:linear-gradient(180deg,rgba(255,77,94,.2),rgba(255,77,94,.05));color:#fff}
nav button.adm.on::after{background:linear-gradient(90deg,transparent,var(--red),transparent)}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0}
.bal{display:flex;align-items:center;gap:9px;background:linear-gradient(180deg,#161d2b,#0f1420);border:1px solid var(--line2);border-radius:12px;padding:7px 13px}
.bal .v{font-family:'Russo One';font-size:17px;color:var(--gold);min-width:74px;text-align:right}
.bal .v.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22);color:#fff}100%{transform:scale(1)}}
.bal .tk{font-size:10px;color:var(--mut2);letter-spacing:.1em;text-transform:uppercase}
.iconbtn{position:relative;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);display:grid;place-items:center;transition:.2s;color:var(--mut);flex-shrink:0}
.iconbtn:hover{background:rgba(255,255,255,.1);color:#fff}
.iconbtn.act{color:var(--gold);border-color:rgba(255,182,46,.4);background:rgba(255,182,46,.12)}
.iconbtn .bdot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;font-family:'Oswald'}
.avatar{width:40px;height:40px;border-radius:12px;background:conic-gradient(from 210deg,#3ddc84,#22d3ee,#ffb62e,#3ddc84);padding:2px;cursor:pointer;flex-shrink:0}
.avatar div{width:100%;height:100%;border-radius:10px;background:#0d1220;display:grid;place-items:center;font-family:'Russo One';font-size:14px}

.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:12px;font-family:'Oswald';font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;transition:.22s;overflow:hidden;white-space:nowrap;min-height:44px}
.btn:active{transform:scale(.965)}
.btn-gold{background:linear-gradient(180deg,#ffd25e,#f0a113);color:#231600;box-shadow:0 8px 26px -8px rgba(255,182,46,.75),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-gold:hover{box-shadow:0 12px 34px -8px rgba(255,182,46,.95);transform:translateY(-2px)}
.btn-gr{background:linear-gradient(180deg,#5cf0a0,#12a860);color:#00230f}
.btn-cy{background:linear-gradient(180deg,#4ee6ff,#0aa8c9);color:#00222b}
.btn-gh{background:rgba(255,255,255,.055);border:1px solid var(--line2);color:var(--txt)}
.btn-gh:hover{background:rgba(255,255,255,.11)}
.btn-red{background:linear-gradient(180deg,#ff6b78,#d61f31);color:#fff}
.btn:disabled{opacity:.38;pointer-events:none;filter:grayscale(.6)}
.btn.sm{padding:8px 14px;font-size:12px;border-radius:9px;min-height:36px}

main{position:relative;z-index:5;max-width:1560px;margin:0 auto;padding:26px 22px 80px;min-height:70vh}
#app{transition:opacity .18s ease}
#app.fading{opacity:0}
.page{animation:pageIn .3s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.reveal{animation:rev .4s ease both;animation-delay:calc(var(--i,0)*20ms)}
@keyframes rev{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.sechead{display:flex;align-items:flex-end;gap:16px;margin:34px 0 18px;flex-wrap:wrap}
.sechead h2{font-size:26px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:11px}
.sechead h2::before{content:'';width:5px;height:24px;border-radius:3px;background:linear-gradient(180deg,var(--green),var(--cyan));flex-shrink:0}
.sechead p{color:var(--mut);font-size:13.5px;margin-bottom:3px}
.sechead .sp{margin-left:auto}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.search{position:relative;flex:1;min-width:200px;max-width:330px}
.search input{width:100%;padding:11px 14px 11px 40px;border-radius:11px;background:rgba(255,255,255,.045);border:1px solid var(--line);color:#fff;font-size:16px;transition:.22s;outline:none}
.search input:focus{border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.06)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--mut2)}
.chip{padding:9px 16px;border-radius:10px;background:rgba(255,255,255,.045);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--mut);transition:.2s;text-transform:uppercase;letter-spacing:.06em;font-family:'Oswald';min-height:38px;white-space:nowrap}
.chip:hover{color:#fff;background:rgba(255,255,255,.09)}
.chip.on{background:linear-gradient(180deg,rgba(61,220,132,.22),rgba(61,220,132,.07));border-color:rgba(61,220,132,.45);color:#a9f5cd}
select.sel{padding:10px 14px;border-radius:11px;background:rgba(255,255,255,.045);border:1px solid var(--line);color:#fff;font-size:16px;outline:none;cursor:pointer;min-height:42px;width:100%}
select.sel option{background:#131a26}
.inp{width:100%;padding:12px 15px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid var(--line2);color:#fff;font-size:16px;outline:none}
.inp:focus{border-color:rgba(34,211,238,.5)}

.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:20px}
.ccard{position:relative;border-radius:18px;overflow:hidden;cursor:pointer;background:linear-gradient(180deg,#111726,#0d1119 60%);border:1px solid var(--line);transition:transform .35s cubic-bezier(.2,.9,.3,1),box-shadow .35s,border-color .35s;display:flex;flex-direction:column;content-visibility:auto;contain-intrinsic-size:auto 400px}
.ccard::before{content:'';position:absolute;inset:0;opacity:0;transition:.4s;pointer-events:none;background:radial-gradient(80% 60% at 50% 0%,var(--acc-a),transparent 70%)}
.ccard:hover{transform:translateY(-9px);border-color:var(--acc);box-shadow:0 26px 50px -20px rgba(0,0,0,.9),0 0 40px -14px var(--acc)}
.ccard:hover::before{opacity:1}
.ccard.locked{filter:grayscale(.5) brightness(.75)}
.ccard .cbadge{position:absolute;top:12px;left:12px;z-index:4;padding:4px 10px;border-radius:7px;font-family:'Oswald';font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.55);border:1px solid var(--line2)}
.ccard .chot{background:linear-gradient(90deg,#ff2fb9,#ff6a00);border-color:transparent;color:#fff}
.ccard .cnew{background:linear-gradient(90deg,#22d3ee,#4b69ff);border-color:transparent;color:#fff}
.ccard .ctop{background:linear-gradient(90deg,#ffd25e,#f0a113);border-color:transparent;color:#231600}
.ccard .cimg{height:196px;display:grid;place-items:center;position:relative;z-index:2;padding:14px}
.ccard .cimg .glow{position:absolute;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,var(--acc),transparent 65%);opacity:.42;transition:opacity .4s}
.ccard:hover .cimg .glow{opacity:.75}
.ccard .cimg svg,.ccard .cimg img{width:180px;position:relative;z-index:2;transition:transform .5s cubic-bezier(.2,.9,.3,1)}
.ccard:hover .cimg svg,.ccard:hover .cimg img{transform:scale(1.1) translateY(-5px)}
.ccard .cinfo{padding:15px 17px 17px;border-top:1px solid var(--line);position:relative;z-index:3}
.ccard .cname{font-family:'Oswald';font-size:17.5px;font-weight:600;text-transform:uppercase;letter-spacing:.045em;display:flex;align-items:center;gap:8px}
.ccard .cname i{width:8px;height:8px;border-radius:50%;background:var(--acc);flex-shrink:0}
.ccard .cmeta{display:flex;align-items:center;gap:8px;margin-top:9px}
.ccard .cprice{font-family:'Russo One';font-size:19px;color:var(--gold)}
.ccard .ctopm{margin-left:auto;font-size:10.5px;color:var(--mut2);text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);padding:3px 8px;border-radius:6px;white-space:nowrap;display:flex;align-items:center;gap:5px}
.ccard .ctopm::before{content:'';width:10px;height:10px;background:var(--gold);clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);flex-shrink:0}
.ccard .cbuy{margin-top:13px;width:100%;padding:11px;border-radius:11px;font-family:'Oswald';font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid var(--line2);transition:.25s;pointer-events:none;min-height:40px}
.ccard:hover .cbuy{background:linear-gradient(180deg,#ffd25e,#f0a113);color:#231600;border-color:transparent}
.ccard .rbar{display:flex;gap:2px;margin-top:11px;height:4px;border-radius:3px;overflow:hidden}
.ccard .rbar i{flex:1;border-radius:2px;min-width:1px}

.freeRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:18px}
.fcard{position:relative;border-radius:20px;overflow:hidden;padding:20px;cursor:pointer;background:linear-gradient(150deg,rgba(61,220,132,.14),rgba(10,16,26,.9) 55%),linear-gradient(180deg,#151c2a,#101521);border:1px solid rgba(61,220,132,.28);transition:.34s;display:flex;gap:16px;align-items:center;min-height:100%}
.fcard:hover{transform:translateY(-7px);border-color:rgba(61,220,132,.6);box-shadow:0 24px 46px -20px #000,0 0 44px -16px rgba(61,220,132,.85)}
.fcard.wait{border-color:rgba(255,255,255,.09);background:linear-gradient(180deg,#151c2a,#101521)}
.fcard .fimg{width:112px;flex-shrink:0;position:relative;display:grid;place-items:center}
.fcard .fimg .g{position:absolute;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,var(--acc),transparent 65%);opacity:.4}
.fcard .fimg svg{width:104px;position:relative;z-index:2}
.fcard .fbody{flex:1;min-width:0}
.fcard .ftag{display:inline-block;padding:3px 9px;border-radius:6px;font-family:'Oswald';font-size:10px;letter-spacing:.14em;background:linear-gradient(90deg,#3ddc84,#12a860);color:#00230f;font-weight:600;margin-bottom:7px}
.fcard h3{font-size:19px;text-transform:uppercase;font-weight:600}
.fcard .fd{font-size:12px;color:var(--mut);margin:5px 0 10px;line-height:1.35}
.fcard .frow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.fcard .cd{font-family:'Russo One';font-size:15px;padding:5px 11px;border-radius:9px;background:rgba(0,0,0,.45);border:1px solid var(--line)}
.fcard .cd.ok{color:var(--green);border-color:rgba(61,220,132,.45);background:rgba(61,220,132,.12)}
.fcard .cd.wait2{color:var(--cyan)}
.fcard .ev{font-size:11px;color:var(--mut2)}
.fcard .ev b{color:var(--gold);font-family:'Russo One';font-size:13px}

.twoCol{display:grid;grid-template-columns:minmax(0,1fr) 328px;gap:22px;align-items:start}
.livePanel{border-radius:18px;background:linear-gradient(180deg,#151c2a,#101521);border:1px solid var(--line);overflow:hidden}
.livePanel .lp-h{display:flex;align-items:center;gap:9px;padding:14px 17px;border-bottom:1px solid var(--line)}
.livePanel .lp-h b{font-family:'Oswald';font-size:13.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:600}
.livePanel .lp-h i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.liveList{max-height:432px;overflow:hidden;padding:8px}
.ldrop{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;animation:ldIn .4s ease both;margin-bottom:4px;background:rgba(255,255,255,.022);border-left:3px solid var(--rc)}
@keyframes ldIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
.ldrop .lw{width:52px;height:34px;flex-shrink:0}
.ldrop .lt{flex:1;min-width:0}
.ldrop .lt b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldrop .lt span{font-size:11px;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ldrop .lp{font-family:'Russo One';font-size:12.5px;color:var(--rc);flex-shrink:0}
.pane{background:linear-gradient(180deg,#151c2a,#101521);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--sh)}
.hintList{list-style:none;display:grid;gap:9px}
.hintList li{display:flex;gap:9px;font-size:12.5px;color:var(--mut);align-items:flex-start;line-height:1.4}
.hintList li b{color:var(--green);flex-shrink:0}

.mask{position:fixed;inset:0;z-index:600;background:rgba(3,5,10,.85);display:grid;place-items:center;padding:22px;animation:fadeIn .2s ease both;overflow-y:auto}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{position:relative;width:100%;max-width:940px;border-radius:22px;background:linear-gradient(180deg,#161d2c,#0c1119);border:1px solid var(--line2);box-shadow:0 40px 100px -20px #000;animation:mIn .3s cubic-bezier(.2,1.2,.35,1) both;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
@keyframes mIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.modal.sm{max-width:480px}.modal.md{max-width:700px}
.mhead{display:flex;align-items:center;gap:14px;padding:19px 24px;border-bottom:1px solid var(--line);flex-shrink:0}
.mhead h3{font-size:19px;text-transform:uppercase;font-weight:600;letter-spacing:.05em}
.mhead .x{margin-left:auto;width:38px;height:38px;border-radius:9px;background:rgba(255,255,255,.06);display:grid;place-items:center;transition:.2s;color:var(--mut);flex-shrink:0;font-size:15px}
.mhead .x:hover{background:var(--red);color:#fff}
.mbody{padding:24px;overflow-y:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.mfoot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;flex-shrink:0;background:#0c1119}

.omStage{padding:22px 22px 6px;display:flex;flex-direction:column;gap:14px}
.omReels{display:flex;flex-direction:column;gap:12px}
.reelbox{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#0a0e17,#070a11);border:1px solid var(--line);height:172px;contain:strict}
.reelbox::before,.reelbox::after{content:'';position:absolute;top:0;bottom:0;width:110px;z-index:5;pointer-events:none}
.reelbox::before{left:0;background:linear-gradient(90deg,#080b12,transparent)}
.reelbox::after{right:0;background:linear-gradient(270deg,#080b12,transparent)}
.reel-track{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;gap:9px;will-change:transform;contain:layout style}
.ritem{width:158px;height:150px;flex-shrink:0;border-radius:12px;position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(0,0,0,.35));border:1px solid rgba(255,255,255,.09);border-bottom:3px solid var(--rc);display:grid;place-items:center;padding:9px}
.ritem .rglow{position:absolute;inset:0;background:radial-gradient(60% 55% at 50% 50%,color-mix(in srgb,var(--rc) 26%,transparent),transparent 72%)}
.ritem .wsvg{width:100%;height:92px;position:relative;z-index:2}
.ritem .rname{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:600;padding:0 6px;z-index:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dfe6f2}
.ritem.hit{border-color:#fff;box-shadow:0 0 30px -4px var(--rc)}
.marker{position:absolute;left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%);z-index:8;background:linear-gradient(180deg,transparent,var(--gold),transparent)}
.marker::before,.marker::after{content:'';position:absolute;left:50%;transform:translateX(-50%);border:7px solid transparent}
.marker::before{top:-1px;border-top-color:var(--gold)}
.marker::after{bottom:-1px;border-bottom-color:var(--gold)}

.resGrid{display:grid;gap:14px;padding:6px 22px 0}
.resGrid.c1{grid-template-columns:1fr;max-width:330px;margin:0 auto;width:100%}
.resGrid.c2{grid-template-columns:repeat(2,1fr)}
.resGrid.c3{grid-template-columns:repeat(3,1fr)}
.resGrid.c4,.resGrid.c5{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.rcard{position:relative;border-radius:16px;overflow:hidden;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.4));border:1px solid var(--rc);box-shadow:0 0 34px -10px var(--rc);animation:rcIn .4s ease both;animation-delay:calc(var(--i,0)*70ms)}

'use strict';
const DEV=(()=>{
  const ua=navigator.userAgent||'';
  const touch=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;
  const phone=/Android.*Mobile|iPhone|iPod|Windows Phone|webOS|BlackBerry|IEMobile|Opera Mini|Mobile Safari/i.test(ua);
  const tablet=/iPad|Tablet|PlayBook|Silk|(Android(?!.*Mobile))/i.test(ua);
  const w=Math.min(innerWidth,screen.width||1e5);
  let mode='desktop';
  if((phone||(touch&&w<820)||w<700)&&!tablet)mode='mobile';
  else if(tablet||(touch&&w<1200))mode='tablet';
  return {mode,touch};
})();

  init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
  tone(f,d,type='sine',v=.06,sl=0){if(!this.on)return;this.init();if(!this.ctx)return;
    const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,c.currentTime);

    g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(v,c.currentTime+.008);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+.03)},

function weaponSVG(wt,sk,num){
  const key=wt+'|'+sk+(num?'|n'+num:'');let img=SVG_CACHE.get(key);if(img)return img;
  const A=ART[wt]||ART.rifle_ak,S=SKINS[sk]||SKINS.sand,id=uid();
  const p=A.vb.split(' ').map(Number),w=p[2],h=p[3];
  const sh=A.shapes.map(d=>`<path d="${d}"/>`).join('');
  const R=seeded(S.n+S.base);let defs='',body='';
  const bg=f=>`<rect x="-10" y="-10" width="${w+20}" height="${h+20}" fill="${f}"/>`;
  switch(S.pat){
    case 'solid':defs+=`<linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${S.c[0]}"/><stop offset=".48" stop-color="${S.base}"/><stop offset="1" stop-color="${S.c[1]}"/></linearGradient>`;body=bg(`url(#g${id})`);break;
    case 'fade':{const st=S.c.length;defs+=`<linearGradient id="g${id}" x1="0" y1="0" x2="1" y2=".35"><stop offset="0" stop-color="${S.base}"/>${S.c.map((c,i)=>`<stop offset="${((i+1)/(st+.6)).toFixed(2)}" stop-color="${c}"/>`).join('')}<stop offset="1" stop-color="${S.base}"/></linearGradient>`;body=bg(`url(#g${id})`);break}
    case 'stripes':defs+=`<pattern id="p${id}" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><rect width="34" height="34" fill="${S.base}"/><rect width="14" height="34" fill="${S.c[0]}"/><rect x="18" width="4" height="34" fill="${S.c[1]}" opacity=".8"/></pattern>`;body=bg(`url(#p${id})`);break;
    case 'camo':{let b='';for(let i=0;i<14;i++){const cx=R()*w,cy=R()*h,rx=8+R()*30,ry=6+R()*20;b+=`<ellipse cx="${cx|0}" cy="${cy|0}" rx="${rx|0}" ry="${ry|0}" fill="${R()>.5?S.c[0]:S.c[1]}" opacity="${(.4+R()*.5).toFixed(2)}"/>`}body=bg(S.base)+b;break}
    case 'geo':{let g='';for(let i=0;i<10;i++){const x=R()*w,y=R()*h,s=10+R()*38,col=i%3===0?(S.c[1]||S.c[0]):S.c[0];g+=R()>.45?`<rect x="${x|0}" y="${y|0}" width="${s|0}" height="${(s*.45)|0}" fill="${col}" opacity="${(.35+R()*.5).toFixed(2)}"/>`:`<polygon points="${x|0},${y|0} ${(x+s)|0},${(y+s*.5)|0} ${x|0},${(y+s)|0}" fill="${col}" opacity="${(.3+R()*.5).toFixed(2)}"/>`}defs+=`<linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${S.c[0]}" stop-opacity=".28"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient>`;body=bg(S.base)+g+`<rect x="-10" y="-10" width="${w+20}" height="${h+20}" fill="url(#g${id})"/>`;break}
    case 'marble':{for(let i=0;i<3;i++)defs+=`<radialGradient id="m${id}${i}" cx="${R().toFixed(2)}" cy="${R().toFixed(2)}" r=".75"><stop offset="0" stop-color="${S.c[i%S.c.length]}" stop-opacity=".95"/><stop offset="1" stop-color="${S.c[(i+1)%S.c.length]}" stop-opacity="0"/></radialGradient>`;body=bg(S.base);for(let i=0;i<3;i++)body+=`<rect x="-10" y="-10" width="${w+20}" height="${h+20}" fill="url(#m${id}${i})"/>`;break}
    case 'flame':{let f='';for(let i=0;i<4;i++){const y=R()*h,len=(.35+R()*.6)*w,col=i%2?S.c[0]:(S.c[1]||S.c[0]);f+=`<path d="M${w} ${y|0} C ${(w-len*.6)|0} ${(y-22)|0} ${(w-len*.7)|0} ${(y+26)|0} ${(w-len)|0} ${y|0} C ${(w-len*.66)|0} ${(y+12)|0} ${(w-len*.5)|0} ${(y-8)|0} ${w} ${(y+9)|0} Z" fill="${col}" opacity=".82"/>`}defs+=`<linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${S.base}"/><stop offset="1" stop-color="${S.c[0]}"/></linearGradient>`;body=bg(`url(#g${id})`)+f;break}
    case 'tiger':{let t='';for(let i=0;i<10;i++){const x=R()*w,y=R()*h;t+=`<path d="M${x|0} ${y|0} q ${(10+R()*20)|0} ${(R()*16-8)|0} ${(26+R()*34)|0} ${(R()*10-5)|0} l 0 ${(5+R()*7)|0} q ${(-24-R()*20)|0} ${(R()*10)|0} ${(-28-R()*18)|0} 0 Z" fill="${S.c[0]}" opacity=".9"/>`}defs+=`<linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${S.c[1]||S.base}"/><stop offset=".5" stop-color="${S.base}"/><stop offset="1" stop-color="${S.c[1]||S.base}"/></linearGradient>`;body=bg(`url(#g${id})`)+t;break}
    case 'digital':defs+=`<pattern id="p${id}" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="${S.base}"/><rect width="8" height="8" fill="${S.c[0]}" opacity=".85"/><rect x="8" y="8" width="8" height="8" fill="${S.c[1]||S.c[0]}" opacity=".6"/></pattern>`;body=bg(`url(#p${id})`);break;
    default:body=bg(S.base);
  }
  defs+=`<linearGradient id="metal${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".2"/><stop offset=".5" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity=".5"/></linearGradient>`;
  body+=`<rect x="-10" y="-10" width="${w+20}" height="${h+20}" fill="url(#metal${id})"/>`;
  defs+=`<linearGradient id="spec${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>`;
  body+=`<rect x="-10" y="${(h*0.16).toFixed(0)}" width="${w+20}" height="${(h*0.16).toFixed(0)}" fill="url(#spec${id})"/>`;
  const N_SCR=Math.floor(8+R()*6);
  for(let i=0;i<N_SCR;i++){
    const x1=R()*w,y1=R()*h;const x2=x1+(R()*54-27),y2=y1+(R()*22-11);
    const op=(R()*0.32+0.08).toFixed(2);const col=R()>0.42?'#ffffff':'#000000';const sw=(R()*0.9+0.25).toFixed(2);
    body+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${col}" stroke-width="${sw}" opacity="${op}" stroke-linecap="round"/>`;
  }
  const N_DOT=Math.floor(8+R()*4);
  for(let i=0;i<N_DOT;i++){
    const x=R()*w,y=R()*h,r=(R()*0.9+0.2);const op=(R()*0.26+0.04).toFixed(2);const col=R()>0.5?'#ffffff':'#000000';
    body+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" fill="${col}" opacity="${op}"/>`;
  }
  defs+=`<linearGradient id="rim${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".4"/><stop offset=".05" stop-color="#ffffff" stop-opacity="0"/></linearGradient>`;
  body+=`<rect x="-10" y="-10" width="${w+20}" height="${h+20}" fill="url(#rim${id})"/>`;
  const det=(A.det||[]).map(d=>`<path d="${d}"/>`).join('');
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${A.vb}" preserveAspectRatio="xMidYMid meet"><defs><clipPath id="cp${id}">${sh}</clipPath>${defs}</defs><g clip-path="url(#cp${id})">${body}</g><g fill="rgba(0,0,0,.5)" clip-path="url(#cp${id})">${det}</g><g fill="none" stroke="rgba(0,0,0,.72)" stroke-width="2.4" stroke-linejoin="round">${sh}</g><g fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1" stroke-linejoin="round">${sh}</g></svg>`;
  if(num){
    const p2=A.vb.split(' ').map(Number),vw=p2[2];

    const bx=vw-bw-3,by=4;
    svg=svg.replace('</svg>',
      `<g><rect x="${bx}" y="${by}" width="${bw}" height="${Math.round(bw*0.86)}" rx="${Math.round(bw*0.14)}" fill="#ffb62e" stroke="#0b0e16" stroke-width="2"/>`+
      `<text x="${bx+bw/2}" y="${by+bw*0.62}" font-size="${Math.round(bw*0.58)}" font-family="'Russo One',Arial,sans-serif" text-anchor="middle" fill="#231600" font-weight="700">${num}</text></g></svg>`);
  }
  const encoded='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  img=`<img class="wsvg" alt="" loading="lazy" decoding="async" draggable="false" src="${encoded}">`;
  if(SVG_CACHE.size>400)SVG_CACHE.clear();

  return img;
}

      let list=PAID.slice();

      if(homeSort==='ev')list.sort((a,b)=>(b._ev/b.price)-(a._ev/a.price));

let autoSell=true;
function startOpen(c,count){
  Sound.init();
  if(c.free){
    count=1;const avail=State.cd[c.id]||0;
    if(Date.now()<avail){
      if(State.tokens>0){State.tokens--;State.cd[c.id]=0;save();
        toast('🎟️ Жетон использован','Кулдаун «'+c.name+'» сброшен','ok');Sound.coin()}
      else return toast('Кейс ещё не готов','Следующий через '+cdStr(avail-Date.now()),'err')}
    State.cd[c.id]=Date.now()+c.cd;State.stats.free++;bump('free')
  }else{
    const total=c.price*count;
    if(State.balance<total){Sound.lose();return UI.noMoney(c)}
    State.balance-=total;State.stats.spent+=total}
  State.stats.opened+=count;State.stats.xp+=count*(c.free?8:14);save();updateBal(true);
  const results=[];for(let i=0;i<count;i++)results.push(rollItem(c));
  showOpenModal(c,results);
}

function showOpenModal(c,results){
  const fast=State.fast,total=results.reduce((s,i)=>s+i.price,0),multi=results.length>1;
  const m=modal(`<div class="mhead"><h3 style="color:${c.acc}">${c.name}</h3>
    <span style="font-size:11.5px;color:var(--mut2);margin-left:auto">${c.free?'бесплатно':'x'+results.length}</span>
    <button class="x" onclick="closeModal()">✕</button></div>
    <div class="mbody" style="padding:0" id="openBody">
      <div class="omStage" id="omStage" ${fast?'style="display:none"':''}>${fast?'':`<div class="omReels">${results.map((r,i)=>`<div class="reelbox${multi?' multi':''}" data-i="${i}"><div class="reel-track"></div><div class="marker"></div></div>`).join('')}</div>`}</div>
      <div class="resGrid c${Math.min(results.length,5)}" id="resGrid" style="${fast?'':'display:none'}"></div>
      <div class="omSum" id="omSum" style="display:none">Общая стоимость дропа <b>${fmt(total)}</b></div>
    </div>
    <div class="mfoot" id="omFoot" style="display:none">
      <button class="btn btn-gh" onclick="closeModal()">Закрыть</button>
      <button class="btn btn-gr" id="sellAllBtn">💰 Продать · ${fmt(total)}</button>
      <button class="btn btn-gold" id="keepAllBtn">🎒 В инвентарь</button>
      <button class="btn btn-cy" id="againBtn">🔁 Ещё</button>
    </div>`,'md');
  const root=m.querySelector('.modal');root.style.maxWidth=multi?'1000px':'700px';
  let resolved=false;
  function finish(){
    if(resolved)return;resolved=true;
    const stage=$('#omStage',root);if(stage)stage.style.display='none';
    const grid=$('#resGrid');
    const frag=document.createDocumentFragment();
    results.forEach((it,i)=>{
      const div=document.createElement('div');
      div.className='rcard'+(it.rar==='gold'?' gold':'');
      div.style.setProperty('--i',i);div.style.setProperty('--rc',RAR[it.rar].c);
      div.innerHTML=`<div class="rgl"></div><div class="rimg">${weaponSVG(it.wt,it.sk,it.num)}</div>
        <div class="rtxt"><div class="rrar">${RAR[it.rar].n}${it.num?' · #'+it.num:''}</div><div class="rnm">${it.name}</div>
        <div class="rpr" style="color:${RAR[it.rar].c}">${fmt(it.price)}</div></div>`;
      frag.appendChild(div)});
    grid.innerHTML='';grid.appendChild(frag);
    grid.style.display='';$('#omSum').style.display='';$('#omFoot').style.display='';
    const body=$('.mbody',root);if(body)body.scrollTop=0;
    const best=results.reduce((a,b)=>b.price>a.price?b:a);
    const objs=results.map(it=>addInv(it,c.free?'Бесплатный кейс':c.name));
    let soldSum=0;
    if(autoSell)objs.forEach(o=>{const it=ITEM(o.id);
      if(it&&(it.rar==='consumer'||it.rar==='industrial')&&!isFav(o.uid)){o.st='sold';soldSum+=it.price;bump('sold')}});
    if(soldSum){State.balance+=soldSum;State.stats.earned+=soldSum;toast('Авто-продажа','+'+fmt(soldSum)+' за серый/промышленный дроп','coin')}
    save();updateBal(true);
    setTimeout(()=>{
      if(best.num&&best.num<=3){Sound.fanfare();toast('🔥 ЛОУ-НОМЕР #'+best.num+'!','Вы выбили '+best.name+' за '+fmt(best.price),'gold')}
      else if(best.rar==='gold'){Sound.win(true);toast('🏆 НЕВЕРОЯТНО!','Вы выбили '+best.name,'gold')}
      else if(best.rar==='legendary'){Sound.win(true);toast('🔥 ЛЕГЕНДАРНОЕ!','Выпал '+best.name,'gold')}
      else if(best.rar==='covert'){Sound.win(true);toast('🔥 Тайное!','Выпал '+best.name,'gold')}
      else if(best.rar==='classified'){Sound.win(true)}
      else Sound.win(false);
      Live.push({item:best,user:State.name,case:c.name})},260);
    $('#keepAllBtn').onclick=()=>{Sound.coin();toast('Забрано','Предметы в инвентаре','ok');closeModal();refreshBonusDot()};
    $('#sellAllBtn').onclick=()=>{let s=0;objs.forEach(o=>{if(o.st==='in')s+=sellItem(o)});
      if(s)toast('Продано','+'+fmt(s)+' на баланс','coin');else toast('Уже продано','Авто-продажа сработала','info');
      Sound.coin();closeModal();refreshBonusDot()};
    const ab=$('#againBtn');
    if(ab)ab.onclick=()=>{closeModal();setTimeout(()=>{
      if(c.free){const av=State.cd[c.id]||0;if(Date.now()<av){toast('Подождите','Кейс будет готов через '+cdStr(av-Date.now()),'err');return}}
      startOpen(c,results.length)},200)};
  }
  if(fast){setTimeout(finish,120);return}
  const TOTAL=26,WIN=20;
  const boxes=$$('.reelbox',root);
  boxes.forEach((box,i)=>{
    const track=box.querySelector('.reel-track');
    const frag=document.createDocumentFragment();
    for(let k=0;k<TOTAL;k++){
      const it=k===WIN?results[i]:ITEM(pick(c.items));
      const div=document.createElement('div');
      div.className='ritem';div.style.setProperty('--rc',RAR[it.rar].c);
      div.innerHTML=`<div class="rglow"></div>${weaponSVG(it.wt,it.sk,it.num)}<div class="rname">${it.name}</div>`;
      frag.appendChild(div);
    }
    track.appendChild(frag);
  });
  requestAnimationFrame(()=>{
    let done=0;
    boxes.forEach((box,i)=>{
      const track=box.querySelector('.reel-track');
      const firstItem=track.firstElementChild;if(!firstItem){done++;return}
      const gap=parseFloat(getComputedStyle(track).gap)||9;
      const iw=firstItem.offsetWidth+gap,bw=box.offsetWidth;
      const jitter=rnd(-iw*0.26,iw*0.26);
      const target=WIN*iw+iw/2-bw/2+jitter;
      const dur=(DEV.mode==='mobile'?3200:4200)+i*320;
      let lastIdx=-1,t0=null;
      const ease=p=>1-Math.pow(1-p,5);
      (function frame(t){
        if(!t0)t0=t;
        const p=clamp((t-t0)/dur,0,1);
        const pos=ease(p)*target;
        track.style.transform=`translate3d(${-pos}px,0,0)`;
        const idx=Math.floor(pos/iw);
        if(idx!==lastIdx&&idx>=0&&p<0.965){lastIdx=idx;Sound.tick()}
        if(p<1){requestAnimationFrame(frame)}
        else{
          track.style.transform=`translate3d(${-target}px,0,0)`;
          const winEl=track.children[WIN];if(winEl)winEl.classList.add('hit');
          box.style.boxShadow=`0 0 40px -8px ${RAR[results[i].rar].c}`;
          Sound.tone(680,.13,'triangle',.055);
          done++;if(done===boxes.length)setTimeout(finish,420);
        }
      })(performance.now());
    });
  });
}

async function applyPromo(code){
  const k=code.trim().toUpperCase();if(!k)return;
  if(PROMOS[k]){
    if(State.promo.includes(k))return toast('Уже использован','Этот промокод активирован ранее','err');
    const p=PROMOS[k];State.promo.push(k);save();
    if(p.v)earn(p.v,'Промокод '+k);
    if(p.tk){State.tokens+=p.tk;save();toast('🎟️ Жетоны','+'+p.tk+' жетон(ов)','ok')}
    if(p.cases){
      const cid=p.cases[0].id,n=p.cases[0].n,c=CASE(cid);
      if(!c)return toast('Промокод','Кейс не найден','err');
      const drops=[];for(let i=0;i<n;i++){const it=rollItem(c);drops.push(it);addInv(it,'Промокод '+k)}
      save();Sound.fanfare();
      toast('🎁 Промокод '+k,'+'+n+' предметов из «'+c.name+'»','gold');
      showPromoDrops(c,drops);return;
    }
    Sound.win(false);render();return;
  }
  if(!token)return toast('Промокод','Требуется вход','err');
  try{
    const r=await api('/api/promo/redeem',{code:k});

    const allDrops=[];
    if(r.items&&r.items.length) allDrops.push(...r.items.map(ITEM).filter(Boolean));
    if(r.unresolved_cases&&r.unresolved_cases.length){
      for(const uc of r.unresolved_cases){
        const c=CASE(uc.id);
        if(!c) continue;
        const n=Math.max(0,parseInt(uc.n,10)||0);
        for(let i=0;i<n;i++){
          const it=rollItem(c);
          addInv(it,'Промокод '+k);
          allDrops.push(it);
        }
      }
      if(allDrops.length) save();
    }

    const parts=[];
    if(r.balance>0)parts.push('💰 +'+fmtN(r.balance)+' ₽');
    if(r.tokens>0)parts.push('🎟 +'+r.tokens+' жет.');
    if(allDrops.length)parts.push('📦 +'+allDrops.length+' предм.');
    await syncFromServer();
    Sound.fanfare();
    toast('🎁 Промокод '+k,parts.join(' · ')||'Активирован','gold');
    if(allDrops.length) showPromoDrops({name:'Промокод '+k,acc:'#22d3ee'},allDrops);
  }catch(e){toast('Промокод',e.message,'err')}
}

function showBanScreen(b){
  const old=document.getElementById('banScreen');if(old)old.remove();
  const until=b.until?new Date(b.until).toLocaleString('ru-RU'):'навсегда';

    <div style="font-size:64px;margin-bottom:14px">🚫</div>
    <h1 style="font-family:'Oswald';font-size:38px;text-transform:uppercase;letter-spacing:.06em;color:#ff6b78;margin-bottom:6px">Вы забанены</h1>
    <p style="color:#8792a6;font-size:14px;margin-bottom:26px">Доступ к сайту заблокирован администрацией</p>
    <div style="display:grid;gap:10px;text-align:left;margin-bottom:24px">
      <div style="padding:14px 18px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08)"><div style="font-size:11px;color:#5f6a7d;text-transform:uppercase;letter-spacing:.14em;margin-bottom:5px">Ник</div><b style="font-family:'Russo One';font-size:17px">${String(b.nick||'—').replace(/[<>]/g,'')}</b></div>
      <div style="padding:14px 18px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08)"><div style="font-size:11px;color:#5f6a7d;text-transform:uppercase;letter-spacing:.14em;margin-bottom:5px">Выдан</div><b style="font-size:14px">${at}</b></div>
      <div style="padding:14px 18px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08)"><div style="font-size:11px;color:#5f6a7d;text-transform:uppercase;letter-spacing:.14em;margin-bottom:5px">Разбан</div><b style="font-size:14px">${until}</b></div>
      <div style="padding:14px 18px;border-radius:12px;background:rgba(255,77,94,.1);border:1px solid rgba(255,77,94,.35)"><div style="font-size:11px;color:#ffb3ba;text-transform:uppercase;letter-spacing:.14em;margin-bottom:5px">Осталось</div><b id="banLeft" style="font-family:'Russo One';font-size:22px;color:#ff6b78">—</b></div>
      <div style="padding:14px 18px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08)"><div style="font-size:11px;color:#5f6a7d;text-transform:uppercase;letter-spacing:.14em;margin-bottom:5px">Причина</div><b style="font-size:14px;font-weight:400">${String(b.reason||'не указана').replace(/[<>]/g,'')}</b></div>
      <div style="padding:14px 18px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08)"><div style="font-size:11px;color:#5f6a7d;text-transform:uppercase;letter-spacing:.14em;margin-bottom:5px">Забанил</div><b style="font-size:14px">${String(b.by||'админ').replace(/[<>]/g,'')}</b></div>
    </div>
    <button id="banLogout" class="btn btn-red" style="width:100%">🚪 Выйти из аккаунта</button>
  </div>`;
  document.body.appendChild(w);
  const btn=document.getElementById('banLogout');
  if(btn)btn.onclick=()=>{token=null;localStorage.removeItem('cf_token');location.reload()};
  function tick(){
    const el=document.getElementById('banLeft');if(!el)return;
    if(!b.until){el.textContent='навсегда';return}
    const ms=b.until-Date.now();
    if(ms<=0){el.textContent='срок истёк';setTimeout(()=>location.reload(),1200);return}
    const s=Math.floor(ms/1000);
    el.textContent=(s<3600)?String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'):cdStr(ms);
  }
  tick();setInterval(tick,1000);
}
async function checkBanAndShow(){
  if(!State||!State.name)return;
  try{

    if(r&&r.banned){showBanScreen({nick:r.nick,until:r.until,reason:r.reason,by:r.by,at:r.created});return true}
  }catch(e){}
  return false;
}

async function admGive(){
  const nick=($('#admNick').value||'').trim();
  const bal=parseInt($('#admBal').value)||0;
  const tok=parseInt($('#admTok').value)||0;
  const caseId=$('#admCaseSel').value;
  const caseN=parseInt($('#admCaseN').value)||0;
  if(!nick)return toast('Ошибка','Укажи ник','err');
  if(!bal&&!tok&&!(caseId&&caseN))return toast('Ошибка','Задай хотя бы что-то','err');
  let itemIds=[];
  if(caseId&&caseN>0){const c=CASE(caseId);if(c)for(let i=0;i<caseN;i++)itemIds.push(rollItem(c).id)}
  $('#admGive').disabled=true;
  try{
    const r=await api('/api/admin/give',{nick,balance:bal,tokens:tok,items:itemIds});
    Sound.win(true);
    toast('✅ Выдано',r.nick+' · '+fmt(bal)+' · '+tok+' жет. · '+itemIds.length+' предм.','ok');
    $('#admBal').value=0;$('#admTok').value=0;$('#admCaseN').value=0;$('#admCaseSel').value='';
  }catch(e){toast('Ошибка',e.message,'err')}
  $('#admGive').disabled=false;
}

function doUpgrade(){
  if(upg._running) return;
  const ch=upgChance();if(ch<=0) return;
  const srcObj=upg.src, dstObj=upg.dst;
  if(!srcObj||!dstObj) return;
  const fresh=State.inv.find(x=>x.uid===srcObj.uid);
  if(!fresh||fresh.st!=='in'){toast('Ошибка','Предмет уже недоступен в инвентаре','err');upg.src=null;upg.dst=null;render();return}
  upg._running=true;
  const win=Math.random()<ch;
  const b=$('#upgBtn');if(b)b.disabled=true;
  $$('.pickItem[data-uid]').forEach(el=>el.style.pointerEvents='none');
  $$('#dstList .pickItem').forEach(el=>el.style.pointerEvents='none');
  const sr=$('#slotSrc');if(sr)sr.style.pointerEvents='none';
  const dr=$('#slotDst');if(dr)dr.style.pointerEvents='none';
  Sound.swoosh();
  const needle=$('#wNeedle'),wrap=$('#wheelWrap');
  const sc=ch/2*360,fc=ch*360+(360-ch*360)/2;
  let tg=win?sc+rnd(-ch*150,ch*150):fc+rnd(-(1-ch)*140,(1-ch)*140);
  tg=clamp(tg,win?1:(ch*360+1),win?(ch*360-1):359);
  const total=tg+5*360;let t0=null,dur=4200;
  (function frame(t){
    if(!t0)t0=t;
    const p=clamp((t-t0)/dur,0,1),e=1-Math.pow(1-p,4);
    if(needle)needle.style.transform=`rotate(${e*total}deg)`;
    if(p<1){requestAnimationFrame(frame);return;}
    if(needle)needle.style.transform=`rotate(${total}deg)`;
    const check=State.inv.find(x=>x.uid===srcObj.uid);
    if(!check||check.st!=='in'){
      upg._running=false;upg.src=null;upg.dst=null;
      toast('Ошибка','Предмет исчез из инвентаря — апгрейд отменён','err');
      setTimeout(render,600);return;
    }
    const srcIt=ITEM(srcObj.id);
    if(win){
      if(wrap)wrap.classList.add('win');
      Sound.win(true);
      check.st='upgraded';
      State.stats.upW++;State.stats.xp+=40;State.qp.upw=(State.qp.upw||0)+1;
      addInv(dstObj,'Апгрейд');save();
      toast('⚡ Апгрейд успешен!',srcIt.name+' → '+dstObj.name,'ok');
      Live.push({item:dstObj,user:State.name,case:'Апгрейд'});
      setTimeout(()=>{upg._running=false;upg.src=null;upg.dst=null;render()},1300);
    }else{
      Sound.lose();
      State.stats.upL++;
      check.st='lost';save();
      toast('Предмет потерян',srcIt.name+' уничтожен','err');
      setTimeout(()=>{upg._running=false;upg.src=null;upg.dst=null;render()},1300);
    }
    checkQuests();
  })(performance.now());
}

async function showBattleAnimated(res,bid){
  const pids=Object.keys(res.res);if(pids.length<2){toast('Ошибка','Недостаточно данных','err');return}
  const [p1,p2]=pids;const r1=res.res[p1],r2=res.res[p2];
  const rounds=Math.max(r1.drops.length,r2.drops.length);
  const uid_=String(myId());const isMe=p=>String(p)===uid_;
  const m=modal(`<div class="mhead"><h3>⚔️ Батл</h3><span class="mono" style="color:var(--mut2);margin-left:auto">Раундов: ${rounds}</span>
    <button class="x" onclick="closeModal()">✕</button></div>
    <div class="mbody" style="padding:16px">
    <div class="battleArena" id="baArena">
      <div class="baProgress" id="baProg">${Array.from({length:rounds},(_,i)=>`<i data-r="${i}"></i>`).join('')}</div>
      <div class="baPlayers">
        <div class="baPlayer" id="baP1"><div class="bapName"><i style="background:${isMe(p1)?'#3ddc84':'#22d3ee'}"></i><span>${r1.nick}${isMe(p1)?' (ты)':''}</span></div><div class="bapTotal mono" id="baT1">0 ₽</div></div>
        <div class="baVs">VS</div>
        <div class="baPlayer" id="baP2"><div class="bapName"><i style="background:${isMe(p2)?'#3ddc84':'#22d3ee'}"></i><span>${r2.nick}${isMe(p2)?' (ты)':''}</span></div><div class="bapTotal mono" id="baT2">0 ₽</div></div>
      </div>
      <div class="baReels" id="baReels">
        <div class="baReel" id="baR1"><div class="baReelLbl">${r1.nick}</div><div class="reel-track"></div><div class="marker"></div></div>
        <div class="baReel" id="baR2"><div class="baReelLbl">${r2.nick}</div><div class="reel-track"></div><div class="marker"></div></div>
      </div>
      <div style="text-align:center;font-family:'Oswald';font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)" id="baRoundLbl">Подготовка…</div>
    </div></div>
    <div class="mfoot" id="baFoot" style="display:none"></div>`,'md');
  const arena=$('#baArena'),prog=$('#baProg');let sum1=0,sum2=0;
  const ease=p=>1-Math.pow(1-p,5);
  async function playRound(i){
    const it1=ITEM(r1.drops[i]),it2=ITEM(r2.drops[i]);if(!it1||!it2)return;
    Sound.round();
    $('#baRoundLbl').innerHTML=`<span style="color:var(--gold)">Раунд ${i+1}</span> из ${rounds}`;
    const dot=prog.querySelector(`i[data-r="${i}"]`);if(dot)dot.classList.add('on');
    const r1el=$('#baR1'),r2el=$('#baR2');
    const t1=r1el.querySelector('.reel-track'),t2=r2el.querySelector('.reel-track');
    const TOTAL=20,WIN=15;
    function build(track,it){const frag=document.createDocumentFragment();
      for(let k=0;k<TOTAL;k++){const x=k===WIN?it:pick(ITEMS);const d=document.createElement('div');
        d.className='ritem';d.style.setProperty('--rc',RAR[x.rar].c);
        d.innerHTML=`<div class="rglow"></div>${weaponSVG(x.wt,x.sk,x.num)}<div class="rname">${x.name}</div>`;
        frag.appendChild(d)}track.innerHTML='';track.appendChild(frag)}
    build(t1,it1);build(t2,it2);
    r1el.style.boxShadow='';r2el.style.boxShadow='';
    await new Promise(resolve=>{
      const iw1=t1.firstElementChild.offsetWidth+(parseFloat(getComputedStyle(t1).gap)||7);
      const iw2=t2.firstElementChild.offsetWidth+(parseFloat(getComputedStyle(t2).gap)||7);
      const bw1=r1el.offsetWidth,bw2=r2el.offsetWidth;
      const target1=WIN*iw1+iw1/2-bw1/2+rnd(-iw1*.2,iw1*.2);
      const target2=WIN*iw2+iw2/2-bw2/2+rnd(-iw2*.2,iw2*.2);
      const dur=DEV.mode==='mobile'?2600:3400;let t0=null;
      (function frame(t){if(!t0)t0=t;const p=clamp((t-t0)/dur,0,1),e=ease(p);
        t1.style.transform=`translate3d(${-e*target1}px,0,0)`;
        t2.style.transform=`translate3d(${-e*target2}px,0,0)`;
        if(p<1)requestAnimationFrame(frame);
        else{
          t1.style.transform=`translate3d(${-target1}px,0,0)`;
          t2.style.transform=`translate3d(${-target2}px,0,0)`;
          const h1=t1.children[WIN];if(h1)h1.classList.add('hit');
          const h2=t2.children[WIN];if(h2)h2.classList.add('hit');
          r1el.style.boxShadow=`inset 0 0 34px -8px ${RAR[it1.rar].c}`;
          r2el.style.boxShadow=`inset 0 0 34px -8px ${RAR[it2.rar].c}`;
          Sound.tone(680,.13,'triangle',.055);setTimeout(resolve,620);
        }})(performance.now());
    });
    sum1+=it1.price;sum2+=it2.price;
    $('#baT1').textContent=fmt(sum1);$('#baT2').textContent=fmt(sum2);
    $('#baT1').classList.add('bump');setTimeout(()=>$('#baT1').classList.remove('bump'),500);
    $('#baT2').classList.add('bump');setTimeout(()=>$('#baT2').classList.remove('bump'),500);
    if(dot)dot.classList.add('done');
    await new Promise(r=>setTimeout(r,550));
  }
  for(let i=0;i<rounds;i++)await playRound(i);
  const winner=res.winner;const w=winner===p1?r1:r2,l=winner===p1?r2:r1;
  const wPid=winner,lPid=winner===p1?p2:p1;
  $('#baP1').classList.add(winner===p1?'winner':'loser');
  $('#baP2').classList.add(winner===p2?'winner':'loser');
  $('#baRoundLbl').innerHTML=`<span style="color:var(--gold);font-size:14px">🏆 ПОБЕДИТЕЛЬ: ${w.nick}</span>`;
  const totalPrize=w.total+l.total;
  arena.insertAdjacentHTML('beforeend',`
  <div class="baResult" style="margin-top:16px">
    <div class="baResCard winner"><div class="barCrown">👑</div><div class="barTag">ПОБЕДИТЕЛЬ</div>
      <div class="barNick">${w.nick}${isMe(wPid)?' (ты)':''}</div>
      <div class="barAmt mono">+${fmt(totalPrize)}</div></div>
    <div class="baResCard loser"><div class="barCrown">💀</div><div class="barTag">ПРОИГРАЛ</div>
      <div class="barNick">${l.nick}${isMe(lPid)?' (ты)':''}</div>
      <div class="barAmt mono">-${fmt(l.total)}</div></div>
  </div>`);
  Sound.fanfare();
  const foot=$('#baFoot');foot.style.display='grid';
  const canClaim=String(winner)===uid_&&winner!=='bot'&&!(res.claimed||[]).includes(uid_);
  foot.innerHTML=`
    ${canClaim?`<button class="btn btn-gr" id="baClaim">🎒 Забрать весь дроп</button>`:''}
    <button class="btn btn-gh" onclick="closeModal()">Закрыть</button>
    <button class="btn btn-cy" onclick="closeModal();go('battle')">🔁 Ещё батл</button>`;
  const cl=$('#baClaim');
  if(cl)cl.onclick=async()=>{
    try{await api('/api/battles/'+bid+'/claim',{ok:1});closeModal(true);
      toast('🎒 Дроп получен','Весь лут батла в инвентаре','gold');Sound.win(true);
      await syncFromServer();
    }catch(e){toast('Ошибка',e.message,'err')}};
}

        else if(t.status==='cancelled'){cls='cancelled';lbl='❌ Отменён'}
        const giveTxt=info.give_balance?' + даёт '+fmt(info.give_balance):'';
        const askTxt=info.ask_balance?' + просит '+fmt(info.ask_balance):'';
        return `<div class="tradeCard ${cls}">
          <div class="tc-main"><b>${lbl}</b><span>${who}</span>
            <span>${(info.offer||[]).length} предм. на ${fmt(sum)}${giveTxt}${askTxt}</span></div>
          <div class="tc-acts">${acts}</div></div>`}).join('');
    }
    $$('[data-tc]').forEach(x=>x.onclick=async()=>{
      try{await api('/api/trades/cancel',{trade_id:x.dataset.tc});
        toast('Отменено','Предметы возвращены в инвентарь','info');
        await syncFromServer();
      }catch(e){toast('Ошибка',e.message,'err')}});
    $$('[data-ta]').forEach(x=>x.onclick=async()=>{
      try{await api('/api/trades/accept',{trade_id:x.dataset.ta});
        toast('✅ Обмен принят','Предметы в инвентаре','gold');Sound.win(true);
        await syncFromServer();
      }catch(e){toast('Ошибка',e.message,'err')}});
  }catch(e){const th=$('#tradeHistory');if(th)th.innerHTML=`<div class="empty"><b>Ошибка</b>${e.message}</div>`}
  if(_trTimer)clearInterval(_trTimer);
  _trTimer=setInterval(()=>{if(curPage==='trade'&&!$('#activeModal'))InitTrade(true)},8000);
}

function tickCD(){
  FREE.forEach(c=>{const left=(State.cd[c.id]||0)-Date.now(),ready=left<=0;
    $$(`[data-cd="${c.id}"]`).forEach(el=>{el.textContent=ready?'✔ ДОСТУПЕН':cdStr(left);
      el.classList.toggle('ok',ready);el.classList.toggle('wait2',!ready)})});
  const w=$('#lwCd');if(w){const r=wheelReady();w.textContent=r?'GO':cdStr(State.wheel-Date.now());
    const sb=$('#spinBtn');if(sb){sb.disabled=!r;sb.className='btn '+(r?'btn-gold':'btn-gh');sb.textContent=r?'🎡 Крутить бесплатно':'⏳ '+cdStr(State.wheel-Date.now())}}
  refreshBonusDot();
}
setInterval(tickCD,1000);

let token=localStorage.getItem('cf_token')||null;
async function api(path,body,method){
  const m=method||(body?'POST':'GET');
  const res=await fetch(path,{method:m,
    headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},
    body:body?JSON.stringify(body):undefined});
  if(res.status===401){token=null;localStorage.removeItem('cf_token');showAuth('login');throw new Error('Требуется вход')}
  if(res.status===403){
    const txt=await res.text();
    let banInfo=null;
    try{const j=JSON.parse(txt);if(j&&j.detail){try{banInfo=JSON.parse(j.detail)}catch(e2){}}}catch(e2){}
    if(banInfo&&banInfo.banned){
      showBanScreen({nick:banInfo.nick,until:banInfo.until,reason:banInfo.reason,by:banInfo.by,at:banInfo.created});
      const err=new Error('Вы забанены');err.banInfo=banInfo;throw err;
    }
    throw new Error(txt||'Ошибка сервера');
  }
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.detail||'Ошибка сервера')}
  return res.json()}
const myId=()=>{try{return JSON.parse(atob(token.split('.')[1])).uid}catch(e){return null}};
function showAuth(mode='login'){
  closeModal(true);
  const isLogin=mode==='login';
  const m=modal(`<div class="mhead"><h3>${isLogin?'🔑 Вход':'📝 Регистрация'}</h3>
    <span style="font-size:11px;color:var(--mut2);margin-left:auto">CASEFORGE</span></div>
    <div class="mbody" style="display:grid;gap:11px">
    <input id="aNick" placeholder="Ник" autocomplete="username" class="inp">
    <input id="aPass" type="password" placeholder="Пароль" autocomplete="current-password" class="inp">
    <div id="aErr" style="color:var(--red);font-size:13px;min-height:16px"></div></div>
    <div class="mfoot">
    <button class="btn btn-gh" id="aSwap">${isLogin?'Нет аккаунта? Регистрация':'Уже есть аккаунт? Вход'}</button>
    <button class="btn btn-gold" id="aGo">${isLogin?'Войти':'Создать аккаунт'}</button></div>`,'sm');
  m.querySelector('.modal').dataset.lock='1';
  $('#aSwap').onclick=()=>{Sound.click();showAuth(isLogin?'reg':'login')};
  const submit=async()=>{
    const nick=$('#aNick').value.trim(),pass=$('#aPass').value;
    if(!nick||!pass){$('#aErr').textContent='Заполни оба поля';return}
    $('#aGo').disabled=true;$('#aErr').textContent='';
    try{
      const r=await api('/api/'+(isLogin?'login':'register'),{nick,password:pass});
      token=r.token;localStorage.setItem('cf_token',token);
      closeModal(true);await bootRemote();buildNav();afterBoot();
      api('/api/ping',{ok:1}).catch(()=>{});
      toast(isLogin?'✅ С возвращением':'✅ Аккаунт создан',(r.admin?'ADMIN · ':'')+r.nick,'ok');
    }catch(e){$('#aErr').textContent=e.message||'Ошибка';$('#aGo').disabled=false}};
  $('#aGo').onclick=submit;
  $('#aPass').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
  $('#aNick').addEventListener('keydown',e=>{if(e.key==='Enter')$('#aPass').focus()});
}
async function bootRemote(){
  let st=null;
  for(let i=0;i<3&&!st;i++){
    try{st=await api('/api/state')}
    catch(e){st=null;if(/вход/i.test(e.message||''))throw e;if(i<2)await new Promise(r=>setTimeout(r,1200))}}
  const local=loadLocal();
  if(st){
    if((st.syncTs||0)>=(local.syncTs||0))State=Object.assign(JSON.parse(JSON.stringify(DEF)),st);
    else{State=Object.assign(JSON.parse(JSON.stringify(DEF)),local);pushState()}
  }else{
    State=Object.assign(JSON.parse(JSON.stringify(DEF)),local);_offline=true;
    toast('⚠️ Нет связи с сервером','Прогресс синхронизируется, когда сеть появится','err')}
  window._srvTs=Date.now()/1000;balShown=0;_booted=true;
}
