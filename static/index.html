<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CASEFORGE — бесплатные кейсы CS2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070a12;
  --panel:#111827;
  --panel2:#151c2a;
  --line:rgba(255,255,255,.08);
  --txt:#e5e7eb;
  --mut:#94a3b8;
  --gold:#ffb62e;
  --green:#3ddc84;
  --red:#ff4d5e;
  --cyan:#22d3ee;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer;min-height:44px}
input{outline:none}
h1,h2,h3,h4{margin:0 0 8px}
h2{font-size:22px}
h3{font-size:18px}
.small{font-size:12px;color:var(--mut)}
.muted{color:var(--mut);font-size:13px}
.price{color:var(--gold);font-weight:800}
header{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;
  background:rgba(7,10,18,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.logo{font-weight:900;letter-spacing:.04em;white-space:nowrap}
.logo b{color:var(--gold)}
.balance{
  margin-left:auto;
  padding:9px 11px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0d1422;
  font-weight:900;
  color:var(--gold);
  white-space:nowrap;
  max-width:42vw;
  overflow:hidden;
  text-overflow:ellipsis;
}
.avatar{
  width:44px;height:44px;border-radius:13px;
  background:#111827;border:1px solid var(--line);
  display:grid;place-items:center;font-weight:900;flex:0 0 auto;
}
nav{
  position:sticky;top:65px;z-index:55;
  display:flex;gap:7px;
  overflow-x:auto;
  padding:9px 12px;
  background:rgba(7,10,18,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:0 0 auto;
  padding:10px 12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#0d1422;
  color:var(--mut);
  font-weight:800;
  white-space:nowrap;
}
nav button.on{
  color:#fff;
  background:rgba(255,182,46,.14);
  border-color:rgba(255,182,46,.42);
}
main{padding:12px;max-width:1400px;margin:0 auto;min-height:72vh}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{
  background:linear-gradient(180deg,var(--panel2),#0f1522);
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
  contain:content;
}
.case-card .case-art{
  height:72px;display:grid;place-items:center;
  font-size:42px;margin-bottom:8px;
}
.case-card button{
  width:100%;margin-top:10px;
  border-radius:12px;
  background:rgba(255,255,255,.07);
  border:1px solid var(--line);
  font-weight:800;
}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.btn{
  padding:13px 14px;border-radius:14px;
  font-weight:900;
  background:#111827;
  border:1px solid var(--line);
}
.btn.gold{background:linear-gradient(180deg,#ffd25e,#f0a113);color:#231600;border:none}
.btn.green{background:linear-gradient(180deg,#5cf0a0,#12a860);color:#04140b;border:none}
.btn.red{background:linear-gradient(180deg,#ff6b78,#d61f31);color:#fff;border:none}
.btn:disabled{opacity:.45;pointer-events:none}
.mask{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.72);
  display:grid;place-items:center;
  padding:12px;
  overflow:auto;
}
.modal{
  width:100%;max-width:880px;
  max-height:94vh;
  display:flex;flex-direction:column;
  background:#0d1320;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
}
.mhead{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;
  border-bottom:1px solid var(--line);
}
.mhead .x{
  margin-left:auto;width:44px;border-radius:12px;
  background:#111827;border:1px solid var(--line);
  font-weight:900;
}
.mbody{padding:12px;overflow:auto;min-height:0}
.mfoot{
  position:sticky;bottom:0;
  padding:10px;
  background:#0d1320;
  border-top:1px solid var(--line);
  display:grid;gap:8px;
}
.count-row{
  display:flex;gap:8px;overflow-x:auto;
  padding-bottom:8px;
  scroll-snap-type:x proximity;
}
.count-row::-webkit-scrollbar{display:none}
.count-btn{
  flex:0 0 auto;
  min-width:72px;
  padding:12px 10px;
  border-radius:14px;
  border:1px solid var(--line);
  background:#111827;
  font-weight:900;
  scroll-snap-align:start;
  white-space:nowrap;
}
.count-btn.on{
  background:rgba(255,182,46,.16);
  border-color:rgba(255,182,46,.5);
  color:var(--gold);
}
.stepper{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.stepper button{
  width:50px;border-radius:13px;
  border:1px solid var(--line);
  background:#111827;font-weight:900;
}
.stepper input{
  width:76px;text-align:center;
  padding:12px 8px;border-radius:13px;
  border:1px solid var(--line);
  background:#0a0f1a;color:#fff;
}
.results-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:8px;
}
.result-card{
  border:1px solid var(--rc,#666);
  border-radius:14px;
  padding:8px;
  background:#0f1624;
  min-height:116px;
  display:flex;flex-direction:column;justify-content:space-between;gap:6px;
  contain:content;
}
.result-card .n{font-size:12px;font-weight:800;line-height:1.22}
.result-card .p{font-weight:900;color:var(--rc,#fff)}
.item-img{height:52px;display:grid;place-items:center;font-size:30px}
.inv-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:10px;
}
.input{
  width:100%;padding:12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#0a0f1a;color:#fff;
}
.list{display:grid;gap:10px}
.list-row{
  display:flex;gap:10px;align-items:center;
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
  background:#0f1624;
}
.list-row .grow{flex:1;min-width:0}
.badge{
  display:inline-block;padding:4px 8px;border-radius:999px;
  font-size:11px;font-weight:900;border:1px solid var(--line);
  color:var(--mut);
}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom));
  background:#111827;border:1px solid var(--line);
  padding:10px 14px;border-radius:14px;
  z-index:300;max-width:92vw;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.toast.ok{border-color:rgba(61,220,132,.45)}
.toast.err{border-color:rgba(255,77,94,.55)}
.toast.info{border-color:rgba(34,211,238,.45)}
.fast-toggle{display:inline-flex;align-items:center;gap:7px;color:var(--mut);font-size:13px}
.fast-toggle input{width:18px;height:18px}
.selected{outline:2px solid var(--gold);outline-offset:-2px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.stat-card{padding:12px;border:1px solid var(--line);border-radius:16px;background:#0f1624}
.stat-card b{display:block;font-size:22px;margin-top:4px}
@media (max-width:640px){
  main{padding:10px}
  .results-grid{grid-template-columns:repeat(auto-fill,minmax(102px,1fr))}
  .item-img{height:42px;font-size:26px}
  .modal{max-height:96vh;border-radius:16px}
  .balance{max-width:36vw}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header>
  <div class="logo">CASE<b>FORGE</b></div>
  <div class="balance" id="balance">0 ₽</div>
  <button class="avatar" id="avatar" data-nav="profile">F</button>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
'use strict';

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const IS_MOBILE = matchMedia('(max-width:768px)').matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

let DATA_OK = false;
let ITEMS = {};
let CASES = [];
let State = null;
let cur = 'cases';
let token = localStorage.getItem('cf_token') || null;

let openCaseId = null;
let openCount = 1;
let battleSel = [];
let tradeSel = [];
let tradeTarget = '';
let tradeAsk = 0;
let pushTimer = null;

const DEF = {
  balance: 3000,
  inv: [],
  hist: [],
  fast: IS_MOBILE,
  sound: true,
  name: 'F2P',
  tokens: 0,
  welcome: false,
  cd: {},
  wheel: 0,
  daily: { streak: 0, last: 0 },
  promo: [],
  claimed: {},
  qp: { free: 0, got: 0, sold: 0, big: 0, gold: 0, upw: 0, ct: 0, wheel: 0 },
  daily_quests: [],
  daily_claimed: {},
  quest_date: null,
  stats: { opened: 0, best: 0, spent: 0, won: 0, upW: 0, upL: 0, ct: 0, xp: 0, free: 0, earned: 0 },
  created: Date.now(),
  syncTs: 0
};

const RAR_COLORS = {
  consumer: '#b0c3d9', common: '#b0c3d9',
  industrial: '#5e98d9', milspec: '#4b69ff',
  restricted: '#8847ff', classified: '#d32ce6',
  covert: '#eb4b4b', gold: '#ffd700', extraordinary: '#ffd700'
};

function fmt(n) {
  return new Intl.NumberFormat('ru-RU').format(Math.round(Number(n) || 0));
}

function rarColor(r) {
  return RAR_COLORS[String(r || '').toLowerCase()] || '#8aa2ff';
}

function itemIcon(it) {
  return it?.icon || (it?.wt ? '🔫' : '🎁');
}

function itemName(it) {
  return it?.name || `${it?.wt || 'Item'} | ${it?.sk || '???'}`;
}

function toast(title, text = '', type = 'ok') {
  const root = $('#toast-root');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<b>${esc(title)}</b>${text ? `<div class="small">${esc(text)}</div>` : ''}`;
  root.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function modal(html, cls = '') {
  const root = $('#modal-root');
  root.innerHTML = `<div class="mask"><div class="modal ${cls}">${html}</div></div>`;
  return root.querySelector('.modal');
}

function closeModal() {
  $('#modal-root').innerHTML = '';
}

function normalizeData(d) {
  const items = Array.isArray(d.items) ? d.items : Object.values(d.items || {});
  let cases = Array.isArray(d.cases) ? d.cases : Object.values(d.cases || {});

  ITEMS = {};
  items.forEach(i => {
    if (i && i.id != null) ITEMS[i.id] = i;
  });

  CASES = cases
    .filter(c => c && c.id != null)
    .map(c => ({
      ...c,
      id: String(c.id),
      name: c.name || String(c.id),
      price: Number(c.price || 0),
      items: Array.isArray(c.items) ? c.items : [],
      w: c.w && typeof c.w === 'object' ? c.w : {}
    }));
}

async function loadData() {
  const urls = [
    'game_data.json',
    'data/game_data.json',
    'https://raw.githubusercontent.com/Ne-collab228/musor_drop/main/data/game_data.json'
  ];

  for (const url of urls) {
    try {
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) continue;
      const d = await r.json();
      if (d && (d.items || d.cases)) {
        normalizeData(d);
        DATA_OK = CASES.length > 0 || Object.keys(ITEMS).length > 0;
        if (DATA_OK) return true;
      }
    } catch (e) {}
  }
  return false;
}

function defaultState() {
  return JSON.parse(JSON.stringify(DEF));
}

function loadLocal() {
  try {
    return JSON.parse(localStorage.getItem('cf6_state'));
  } catch {
    return null;
  }
}

function saveLocal() {
  try {
    localStorage.setItem('cf6_state', JSON.stringify(State));
  } catch {}
}

function mergeState(st) {
  const base = defaultState();
  State = Object.assign(base, st || {});
  State.stats = Object.assign(defaultState().stats, State.stats || {});
  State.qp = Object.assign(defaultState().qp, State.qp || {});
  State.daily = Object.assign({ streak: 0, last: 0 }, State.daily || {});
  State.inv = Array.isArray(State.inv) ? State.inv : [];
  State.hist = Array.isArray(State.hist) ? State.hist : [];
  State.cd = State.cd || {};
  State.daily_quests = Array.isArray(State.daily_quests) ? State.daily_quests : [];
  State.daily_claimed = State.daily_claimed || {};
  if (typeof State.balance !== 'number') State.balance = DEF.balance;
}

function save() {
  saveLocal();
  updateHeader();
}

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: 'Bearer ' + token } : {})
    },
    body: body ? JSON.stringify(body) : undefined
  });

  if (res.status === 401) {
    token = null;
    localStorage.removeItem('cf_token');
    showAuth();
    throw new Error('Требуется вход');
  }

  if (!res.ok) {
    let d = {};
    try { d = await res.json(); } catch {}
    throw new Error(d.detail || 'Ошибка сервера');
  }

  return res.json();
}

function push() {
  save();
  if (!token) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async () => {
    try {
      State.syncTs = Date.now();
      await api('/api/state', State);
    } catch (e) {
      console.warn(e);
    }
  }, 700);
}

async function syncState() {
  if (!token) return;
  try {
    const st = await api('/api/state');
    mergeState(st);
    save();
  } catch (e) {
    console.warn(e);
  }
}

function updateHeader() {
  const b = $('#balance');
  const a = $('#avatar');
  if (b) b.textContent = fmt(State.balance) + ' ₽';
  if (a) a.textContent = String(State.name || 'F')[0].toUpperCase();
}

function buildNav() {
  const tabs = [
    ['cases', '📦 Кейсы'],
    ['bonus', '🎁 Бонусы'],
    ['battle', '⚔️ Батлы'],
    ['trade', '💱 Обмен'],
    ['up', '⬆️ Апгрейд'],
    ['ct', '📜 Контракт'],
    ['inv', '🎒 Инвентарь'],
    ['profile', '👤 Профиль']
  ];
  $('#nav').innerHTML = tabs.map(([id, label]) =>
    `<button data-nav="${id}" class="${cur === id ? 'on' : ''}">${label}</button>`
  ).join('');
}

function noData() {
  return `
    <div class="card">
      <h2>Нет данных кейсов</h2>
      <div class="muted">
        Скопируй <b>data/game_data.json</b> в папку <b>static/</b> как <b>static/game_data.json</b>,
        или оставь публичный репозиторий, чтобы фронт подтянул данные с GitHub.
      </div>
    </div>
  `;
}

function caseById(id) {
  return CASES.find(c => String(c.id) === String(id));
}

function isFreeCase(c) {
  return !!(c && (c.free || Number(c.price || 0) === 0));
}

function caseCdMs(c) {
  const v = Number(c?.cd || 3600);
  return v < 10000 ? v * 1000 : v;
}

function freeReady(c) {
  if (!isFreeCase(c)) return true;
  const until = Number(State.cd?.[c.id] || 0);
  return Date.now() >= until;
}

function cdStr(ms) {
  ms = Math.max(0, Number(ms) || 0);
  const s = Math.ceil(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const ss = s % 60;
  if (h) return `${h}ч ${m}м`;
  if (m) return `${m}м ${ss}с`;
  return `${ss}с`;
}

function rollCase(c) {
  const ids = Array.isArray(c.items) ? c.items : [];
  if (!ids.length) return null;

  const w = c.w && typeof c.w === 'object' ? Object.entries(c.w) : [];
  let chosen = null;

  if (w.length) {
    let r = Math.random();
    let acc = 0;
    for (const [k, v] of w) {
      acc += Number(v) || 0;
      if (r <= acc) {
        chosen = k;
        break;
      }
    }
    if (chosen == null) chosen = w[w.length - 1][0];

    const pool = ids.filter(id => ITEMS[id] && String(ITEMS[id].rar) === String(chosen));
    if (pool.length) return ITEMS[pick(pool)];
  }

  return ITEMS[pick(ids)] || null;
}

function addItem(it, src, free) {
  const now = Date.now();
  const price = Number(it.price || 0);

  State.inv.unshift({
    uid: 'u' + uid(),
    id: it.id,
    src,
    ts: now,
    st: 'in'
  });

  State.hist.unshift({ id: it.id, ts: now, src, price });
  State.hist = State.hist.slice(0, 150);

  State.stats.won = (State.stats.won || 0) + price;
  State.stats.best = Math.max(State.stats.best || 0, price);
  State.stats.opened = (State.stats.opened || 0) + 1;
  State.stats.xp = (State.stats.xp || 0) + 1;
  State.qp.got = (State.qp.got || 0) + 1;

  if (price >= 1000) State.qp.big = (State.qp.big || 0) + 1;
}

function itemMini(it) {
  const color = rarColor(it.rar);
  return `
    <div class="result-card" style="--rc:${color}">
      <div class="item-img">${itemIcon(it)}</div>
      <div class="n">${esc(itemName(it))}</div>
      <div class="p">${fmt(it.price)} ₽</div>
    </div>
  `;
}

function caseCard(c) {
  const free = isFreeCase(c);
  return `
    <div class="card case-card">
      <div class="case-art">📦</div>
      <div><b>${esc(c.name)}</b></div>
      <div class="muted">${free ? 'Бесплатный кейс' : 'Платный кейс'}</div>
      <div class="price">${free ? 'FREE' : fmt(c.price) + ' ₽'}</div>
      <button data-open-case="${esc(c.id)}">Открыть</button>
    </div>
  `;
}

function PageCases() {
  return `
    <div class="row" style="justify-content:space-between">
      <h2>Кейсы</h2>
      <label class="fast-toggle">
        <input type="checkbox" id="fastMode" ${State.fast ? 'checked' : ''}>
        Быстрое открытие
      </label>
    </div>
    <div class="small" style="margin-bottom:10px">
      На мобиле 3+ кейсов открываются пакетно, без тяжёлых анимаций.
    </div>
    <div class="grid">
      ${CASES.map(caseCard).join('')}
    </div>
  `;
}

function renderCaseModal(c) {
  const free = isFreeCase(c);
  const max = free ? 1 : 10;
  if (openCount > max) openCount = max;
  if (openCount < 1) openCount = 1;

  const preview = (c.items || [])
    .map(id => ITEMS[id])
    .filter(Boolean)
    .slice(0, 12);

  const counts = Array.from({ length: max }, (_, i) => i + 1);

  modal(`
    <div class="mhead">
      <h3>${esc(c.name)}</h3>
      <button class="x" data-close-modal>✕</button>
    </div>

    <div class="mbody">
      <div class="row" style="justify-content:space-between">
        <div class="price">${free ? 'Бесплатно' : fmt(c.price) + ' ₽ за 1 шт.'}</div>
        <label class="fast-toggle">
          <input type="checkbox" id="fastModeModal" ${State.fast ? 'checked' : ''}>
          Fast
        </label>
      </div>

      <div class="small" style="margin:10px 0 6px">Количество:</div>
      <div class="count-row" id="countRow">
        ${counts.map(n => `
          <button class="count-btn ${openCount === n ? 'on' : ''}" data-count="${n}">${n}</button>
        `).join('')}
      </div>

      <div class="stepper">
        <button data-dec>−</button>
        <input id="openCountInput" type="number" min="1" max="${max}" value="${openCount}">
        <button data-inc>+</button>
        <div class="spacer"></div>
        <div class="small">Итого: <b id="openTotal">${fmt((c.price || 0) * openCount)} ₽</b></div>
      </div>

      <div class="small" style="margin:10px 0 8px">Возможный дроп:</div>
      <div class="results-grid">
        ${preview.map(itemMini).join('') || '<div class="muted">Нет данных</div>'}
      </div>
    </div>

    <div class="mfoot">
      <button class="btn gold" data-do-open>

function updateCaseModalTotals() {
  const c = caseById(openCaseId);
  if (!c) return;

  const free = isFreeCase(c);
  const max = free ? 1 : 10;
  openCount = clamp(Number(openCount) || 1, 1, max);

  const total = (Number(c.price) || 0) * openCount;
  const inp = $('#openCountInput');
  const row = $('#countRow');
  const tt = $('#openTotal');
  const btn = $('[data-do-open]');

  if (inp) inp.value = openCount;

  if (row) {
    row.querySelectorAll('.count-btn').forEach(b => {
      b.classList.toggle('on', Number(b.dataset.count) === openCount);
    });
  }

  if (tt) tt.textContent = fmt(total) + ' ₽';

  if (btn) {
    if (free && !freeReady(c)) {
      btn.disabled = true;
      btn.textContent = 'Кулдаун ' + cdStr((State.cd[c.id] || 0) - Date.now());
    } else {
      btn.disabled = false;
      btn.textContent = free ? 'Открыть бесплатно' : `Открыть ${openCount} шт. за ${fmt(total)} ₽`;

  }
}

async function doOpen() {
  const c = caseById(openCaseId);
  if (!c) return;

  const free = isFreeCase(c);
  const cnt = free ? 1 : clamp(Number(openCount) || 1, 1, 10);

  if (free && !freeReady(c)) {
    toast('Кулдаун', 'Подожди ' + cdStr((State.cd[c.id] || 0) - Date.now()), 'err');
    return;
  }

  const cost = (Number(c.price) || 0) * cnt;
  if (State.balance < cost) {
    toast('Не хватает средств', `Нужно ${fmt(cost)} ₽`, 'err');
    return;
  }

  State.balance -= cost;
  if (cost > 0) State.stats.spent = (State.stats.spent || 0) + cost;

  if (free) {
    State.cd[c.id] = Date.now() + caseCdMs(c);
    State.stats.free = (State.stats.free || 0) + cnt;
    State.qp.free = (State.qp.free || 0) + cnt;
  }

  const results = [];
  for (let i = 0; i < cnt; i++) {
    const it = rollCase(c);
    if (it) {
      addItem(it, c.name, free);
      results.push(it);
    }
  }

  push();
  closeModal();
  showResults(c, results, cost);

  if (cur === 'cases') render();
}

function todayStr() {

function yesterdayStr() {

  `;

  if (token && Array.isArray(State.daily_quests) && State.daily_quests.length) {
    html += `<h3 style="margin-top:14px">Ежедневные задания</h3><div class="list">`;

    html += State.daily_quests.map(q => {
      const prog = Number(State.qp?.[q.s] || 0);
      const done = prog >= Number(q.t || 0);
      const claimed = !!State.daily_claimed?.[q.id];

      return `
        <div class="list-row">
          <div class="grow">
            <b>${esc(q.n || 'Задание')}</b>

          </div>
          <button class="btn ${done && !claimed ? 'green' : ''}" data-quest="${esc(q.id)}" ${done && !claimed ? '' : 'disabled'}>
            ${claimed ? 'Получено' : done ? 'Забрать' : 'В процессе'}
          </button>
        </div>
      `;
    }).join('');

    html += `</div>`;
  }

  return html;
}

function claimDaily() {
  const today = todayStr();
  if (State.daily.last === today) return;

  const y = yesterdayStr();
  const streak = State.daily.last === y ? (Number(State.daily.streak) || 0) + 1 : 1;
  const reward = 300 + Math.min(10, streak) * 100;

  State.balance += reward;
  State.daily = { streak, last: today };
  State.stats.earned = (State.stats.earned || 0) + reward;

  push();
  render();
  toast('Бонус получен', `+${fmt(reward)} ₽`);
}

    return;
  }

  switch (cur) {
    case 'cases': main.innerHTML = PageCases(); break;
    case 'bonus': main.innerHTML = PageBonus(); break;
    case 'battle': main.innerHTML = PageBattle(); loadBattles(); break;
    case 'trade': main.innerHTML = PageTrade(); loadTrades(); break;
    case 'up': main.innerHTML = PageUp(); break;
    case 'ct': main.innerHTML = PageContract(); break;
    case 'inv': main.innerHTML = PageInventory(); break;
    case 'profile': main.innerHTML = PageProfile(); break;
    default: main.innerHTML = PageCases();
  }

  updateHeader();
}

document.addEventListener('click', async e => {
  if (e.target.classList && e.target.classList.contains('mask')) {
    closeModal();
    return;
  }

  const el = e.target.closest('button,[data-nav],[data-count],[data-open-case],[data-trade-item]');
  if (!el) return;

  if (el.dataset.nav !== undefined) {
    cur = el.dataset.nav;
    render();
    return;
  }

  if (el.dataset.openCase !== undefined) {
    showCase(el.dataset.openCase);
    return;
  }

  if (el.dataset.openAgain !== undefined) {
    showCase(el.dataset.openAgain);
    return;
  }

  if (el.dataset.closeModal !== undefined) {
    closeModal();
    return;
  }

  if (el.dataset.count !== undefined) {
    openCount = Number(el.dataset.count) || 1;
    updateCaseModalTotals();
    return;
  }

  if (el.dataset.inc !== undefined || el.dataset.dec !== undefined) {
    const c = caseById(openCaseId);
    const max = c && isFreeCase(c) ? 1 : 10;
    openCount = clamp(openCount + (el.dataset.inc !== undefined ? 1 : -1), 1, max);
    updateCaseModalTotals();
    return;
  }

  if (el.dataset.doOpen !== undefined) {
    await doOpen();
    return;
  }

  if (el.dataset.sell !== undefined) {
    sellItem(el.dataset.sell);
    return;
  }

  if (el.dataset.sellall !== undefined) {
    sellAll();
    return;
  }

  if (el.dataset.daily !== undefined) {
    claimDaily();
    return;
  }

  if (el.dataset.quest !== undefined) {
    await claimQuest(el.dataset.quest);
    return;
  }

  if (el.dataset.auth !== undefined) {
    showAuth();
    return;
  }

  if (el.dataset.authMode !== undefined) {
    await doAuth(el.dataset.authMode);
    return;
  }

  if (el.dataset.logout !== undefined) {
    localStorage.removeItem('cf_token');
    location.reload();
    return;
  }

  if (el.dataset.battleCase !== undefined) {
    const id = el.dataset.battleCase;
    const i = battleSel.indexOf(id);
    if (i >= 0) battleSel.splice(i, 1);
    else if (battleSel.length < 10) battleSel.push(id);
    else toast('Максимум 10 кейсов', '', 'err');
    render();
    return;
  }

  if (el.dataset.battleCreate !== undefined) {
    await createBattle();
    return;
  }

  if (el.dataset.battleJoin !== undefined) {
    await joinBattle(el.dataset.battleJoin);
    return;
  }

  if (el.dataset.battleClaim !== undefined) {
    await claimBattle(el.dataset.battleClaim);
    return;
  }

  if (el.dataset.battleView !== undefined) {
    await viewBattle(el.dataset.battleView);
    return;
  }

  if (el.dataset.tradeItem !== undefined) {
    const u = el.dataset.tradeItem;
    const i = tradeSel.indexOf(u);
    if (i >= 0) tradeSel.splice(i, 1);
    else tradeSel.push(u);
    render();
    return;
  }

  if (el.dataset.tradeSend !== undefined) {
    await sendTrade();
    return;
  }

  if (el.dataset.tradeAccept !== undefined) {
    await acceptTrade(el.dataset.tradeAccept);
    return;
  }

  if (el.dataset.tradeCancel !== undefined) {
    await cancelTrade(el.dataset.tradeCancel);
    return;
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'openCountInput') {
    const c = caseById(openCaseId);
    const max = c && isFreeCase(c) ? 1 : 10;
    openCount = clamp(parseInt(e.target.value || '1', 10) || 1, 1, max);
    updateCaseModalTotals();
  }

  if (e.target.id === 'tradeTarget') {
    tradeTarget = e.target.value;
    updateTradeSend();
  }

  if (e.target.id === 'tradeAsk') {
    tradeAsk = parseInt(e.target.value || '0', 10) || 0;
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'fastMode' || e.target.id === 'fastModeModal') {
    State.fast = !!e.target.checked;
    push();

    const other = e.target.id === 'fastMode' ? '#fastModeModal' : '#fastMode';
    const el = $(other);
    if (el) el.checked = State.fast;
  }
});

(async function boot() {
  mergeState(loadLocal());
  await loadData();
  render();

  if (!token) {
    showAuth();
  } else {
    await syncState();
    render();
  }

  setInterval(async () => {
    if (!token) return;
    try {
      await api('/api/ping', { ok: 1 });
    } catch {}
  }, 25000);
})();
</script>
</body>
</html>
