<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#06080e">
<title>CASEFORGE — бесплатные кейсы CS2 · без доната</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/oswald@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/oswald@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/oswald@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/exo-2@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/exo-2@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/russo-one@5/400.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#06080e;--panel:#101521;--panel2:#151c2a;--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.14);--txt:#e9edf6;--mut:#8792a6;--mut2:#5f6a7d;--gold:#ffb62e;--cyan:#22d3ee;--pink:#ff2fb9;--green:#3ddc84;--red:#ff4d5e;--sh:0 18px 50px -12px rgba(0,0,0,.85);--sab:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:'Exo 2',system-ui,sans-serif;font-size:15px;line-height:1.45;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.dsp{font-family:'Oswald',sans-serif;letter-spacing:.02em}
.mono{font-family:'Russo One',sans-serif}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
input,select{font-family:inherit}
svg{display:block}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#0a0d15}::-webkit-scrollbar-thumb{background:#232c3d;border-radius:6px}
html.is-mobile ::-webkit-scrollbar{width:0;height:0}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgfx .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.4;animation:orbFloat 22s ease-in-out infinite}
#bgfx .o1{width:640px;height:640px;background:#1b3cff;top:-220px;left:-160px}
#bgfx .o2{width:520px;height:520px;background:#12a860;bottom:-200px;right:-120px;animation-delay:-7s;opacity:.24}
#bgfx .o3{width:460px;height:460px;background:#00e5ff;top:38%;left:52%;animation-delay:-14s;opacity:.15}
@keyframes orbFloat{0%,100%{transform:translate(0,0)}33%{transform:translate(70px,-50px)}66%{transform:translate(-50px,60px)}}
#bgfx .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse 100% 70% at 50% 0%,#000 20%,transparent 78%)}
header{position:sticky;top:0;z-index:200;backdrop-filter:blur(18px);background:linear-gradient(180deg,rgba(6,8,14,.94),rgba(6,8,14,.72));border-bottom:1px solid var(--line)}
.hwrap{max-width:1560px;margin:0 auto;padding:0 22px;height:70px;display:flex;align-items:center;gap:22px}
.logo{display:flex;align-items:center;gap:11px;flex-shrink:0;cursor:pointer}
.logo .mark{width:40px;height:40px}
.logo .txt{font-family:'Russo One';font-size:19px;line-height:1;letter-spacing:.06em}
.logo .txt b{color:var(--gold)}
.logo .txt span{display:block;font-family:'Exo 2';font-size:8.5px;letter-spacing:.34em;color:var(--mut2);margin-top:4px}
nav{display:flex;gap:3px;margin-left:4px}
nav button{position:relative;padding:10px 14px;border-radius:10px;font-family:'Oswald';font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);transition:.22s;font-weight:600}
nav button:hover{color:#fff;background:rgba(255,255,255,.05)}
nav button.on{color:#fff;background:linear-gradient(180deg,rgba(255,182,46,.16),rgba(255,182,46,.05))}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px}
.bal{display:flex;align-items:center;gap:9px;background:linear-gradient(180deg,#161d2b,#0f1420);border:1px solid var(--line2);border-radius:12px;padding:7px 13px}
.bal .v{font-family:'Russo One';font-size:17px;color:var(--gold);min-width:74px;text-align:right}
.bal .v.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22);color:#fff}100%{transform:scale(1)}}
.bal .tk{font-size:10px;color:var(--mut2);letter-spacing:.1em;text-transform:uppercase}
.iconbtn{position:relative;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);display:grid;place-items:center;transition:.2s;color:var(--mut);flex-shrink:0}
.iconbtn.act{color:var(--gold);border-color:rgba(255,182,46,.4);background:rgba(255,182,46,.12)}
.iconbtn .bdot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{width:40px;height:40px;border-radius:12px;background:conic-gradient(from 210deg,#3ddc84,#22d3ee,#ffb62e,#3ddc84);padding:2px;cursor:pointer;flex-shrink:0}
.avatar div{width:100%;height:100%;border-radius:10px;background:#0d1220;display:grid;place-items:center;font-family:'Russo One';font-size:14px}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:12px;font-family:'Oswald';font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;transition:.22s;overflow:hidden;white-space:nowrap;min-height:44px}
.btn:active{transform:scale(.965)}
.btn-gold{background:linear-gradient(180deg,#ffd25e,#f0a113);color:#231600}
.btn-gr{background:linear-gradient(180deg,#5cf0a0,#12a860);color:#00230f}
.btn-cy{background:linear-gradient(180deg,#4ee6ff,#0aa8c9);color:#00222b}
.btn-gh{background:rgba(255,255,255,.055);border:1px solid var(--line2);color:var(--txt)}
.btn-red{background:linear-gradient(180deg,#ff6b78,#d61f31);color:#fff}
.btn:disabled{opacity:.38;pointer-events:none;filter:grayscale(.6)}
.btn.sm{padding:8px 14px;font-size:12px;border-radius:9px;min-height:36px}
.ticker{position:relative;z-index:10;background:linear-gradient(90deg,rgba(61,220,132,.07),rgba(34,211,238,.07));border-bottom:1px solid var(--line);overflow:hidden;height:52px}
.ticker .tk-in{display:flex;align-items:center;height:100%;white-space:nowrap;will-change:transform;animation:tkScroll 55s linear infinite}
@keyframes tkScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tki{display:inline-flex;align-items:center;gap:9px;padding:0 22px;border-right:1px solid var(--line);height:52px;flex-shrink:0}
.tki .tw{width:44px;height:30px;flex-shrink:0}
.tki .tn{font-size:12.5px;font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.tki .tu{font-size:11px;color:var(--mut2)}
.tki .tp{font-family:'Russo One';font-size:12.5px}
main{position:relative;z-index:5;max-width:1560px;margin:0 auto;padding:26px 22px 70px;min-height:70vh}
#app{transition:opacity .18s,transform .18s}
#app.fading{opacity:0;transform:translateY(10px)}
.page{animation:pageIn .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.reveal{animation:rev .55s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i,0)*38ms)}
@keyframes rev{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
.sechead{display:flex;align-items:flex-end;gap:16px;margin:34px 0 18px;flex-wrap:wrap}
.sechead h2{font-size:26px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:11px}
.sechead h2::before{content:'';width:5px;height:24px;border-radius:3px;background:linear-gradient(180deg,var(--green),var(--cyan));flex-shrink:0}
.sechead p{color:var(--mut);font-size:13.5px;margin-bottom:3px}
.sechead .sp{margin-left:auto}
.hero{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(120% 140% at 12% 0%,#12352a 0%,#0b1220 45%,#070a12 100%);padding:42px 46px;display:flex;gap:34px;align-items:center;min-height:280px}
.hero h1{font-size:clamp(26px,4.2vw,52px);line-height:1.05;font-weight:700;text-transform:uppercase}
.hero h1 em{font-style:normal;background:linear-gradient(96deg,#5cf0a0,#22d3ee 55%,#ffb62e);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{color:var(--mut);font-size:15.5px;max-width:570px;margin:15px 0 22px}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap}
.hero .stats{display:flex;gap:28px;margin-top:28px;flex-wrap:wrap}
.hero .stats b{display:block;font-family:'Russo One';font-size:22px;color:#fff}
.hero .stats span{font-size:10.5px;color:var(--mut2);text-transform:uppercase;letter-spacing:.13em}
.hero .hr{width:330px;flex-shrink:0;display:grid;place-items:center}
.hero .hr .casefloat{width:244px;animation:cfloat 4.6s ease-in-out infinite}
@keyframes cfloat{0%,100%{transform:translateY(-9px)}50%{transform:translateY(9px)}}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.search{position:relative;flex:1;min-width:200px;max-width:330px}
.search input{width:100%;padding:11px 14px;border-radius:11px;background:rgba(255,255,255,.045);border:1px solid var(--line);color:#fff;font-size:16px;outline:none}
.chip{padding:9px 16px;border-radius:10px;background:rgba(255,255,255,.045);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--mut);transition:.2s;text-transform:uppercase;letter-spacing:.06em;font-family:'Oswald';min-height:38px}
.chip.on{background:linear-gradient(180deg,rgba(61,220,132,.22),rgba(61,220,132,.07));border-color:rgba(61,220,132,.45);color:#a9f5cd}
select.sel{padding:10px 14px;border-radius:11px;background:rgba(255,255,255,.045);border:1px solid var(--line);color:#fff;font-size:16px;outline:none}
select.sel option{background:#131a26}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:20px}
.ccard{position:relative;border-radius:18px;overflow:hidden;cursor:pointer;background:linear-gradient(180deg,var(--panel2),var(--panel) 60%);border:1px solid var(--line);transition:transform .38s,border-color .38s}
.ccard:hover{transform:translateY(-9px);border-color:var(--acc)}
.ccard.locked{filter:grayscale(.5) brightness(.75)}
.ccard .cbadge{position:absolute;top:12px;left:12px;z-index:4;padding:4px 10px;border-radius:7px;font-family:'Oswald';font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.55);border:1px solid var(--line2)}
.ccard .chot{background:linear-gradient(90deg,#ff2fb9,#ff6a00);color:#fff}
.ccard .cnew{background:linear-gradient(90deg,#22d3ee,#4b69ff);color:#fff}
.ccard .ctop{background:linear-gradient(90deg,#ffd25e,#f0a113);color:#231600}
.ccard .cfree{background:linear-gradient(90deg,#3ddc84,#12a860);color:#00230f}
.ccard .cimg{height:196px;display:grid;place-items:center;position:relative;z-index:2;padding:14px}
.ccard .cimg svg{width:180px;animation:cfloat2 5.4s ease-in-out infinite}
@keyframes cfloat2{0%,100%{transform:translateY(-5px)}50%{transform:translateY(5px)}}
.ccard .cinfo{padding:15px 17px 17px;border-top:1px solid var(--line);background:linear-gradient(180deg,transparent,rgba(0,0,0,.35))}
.ccard .cname{font-family:'Oswald';font-size:17.5px;font-weight:600;text-transform:uppercase}
.ccard .cprice{font-family:'Russo One';font-size:19px;color:var(--gold);margin-top:9px}
.ccard .cbuy{margin-top:13px;width:100%;padding:11px;border-radius:11px;font-family:'Oswald';font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.06);border:1px solid var(--line2);pointer-events:none}
.freeRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:18px}
.fcard{position:relative;border-radius:20px;overflow:hidden;padding:20px;cursor:pointer;background:linear-gradient(150deg,rgba(61,220,132,.14),rgba(10,16,26,.9) 55%);border:1px solid rgba(61,220,132,.28);display:flex;gap:16px;align-items:center}
.fcard.wait{border-color:rgba(255,255,255,.09)}
.fcard .fimg{width:112px;flex-shrink:0}
.fcard .fimg svg{width:104px}
.fcard .fbody{flex:1;min-width:0}
.fcard h3{font-size:19px;text-transform:uppercase;font-weight:600}
.fcard .cd{font-family:'Russo One';font-size:15px;padding:5px 11px;border-radius:9px;background:rgba(0,0,0,.45);border:1px solid var(--line);margin-top:10px;display:inline-block}
.fcard .cd.ok{color:var(--green);border-color:rgba(61,220,132,.45);background:rgba(61,220,132,.12)}
.fcard .cd.wait2{color:var(--cyan)}
.pane{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:24px}
.caseStage{position:relative;height:400px;display:grid;place-items:center;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#0d1220,#080b13);border:1px solid var(--line)}
.caseStage .bigcase{width:300px;position:relative;z-index:3;animation:cfloat 4.4s ease-in-out infinite;cursor:pointer}
.freeBanner{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:6;padding:6px 16px;border-radius:99px;background:linear-gradient(90deg,#3ddc84,#12a860);color:#00230f;font-family:'Oswald';font-weight:600;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.caseNav{display:flex;gap:5px;flex-wrap:wrap}
.openwrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:26px;align-items:start}
.openSide h1{font-size:36px;text-transform:uppercase;font-weight:700}
.priceRow{display:flex;align-items:center;gap:16px;padding:15px 18px;border-radius:14px;background:rgba(0,0,0,.32);border:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.priceRow .big{font-family:'Russo One';font-size:30px;color:var(--gold)}
.priceRow .big.gr{color:var(--green)}
.openBtns{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.openBtns.one{grid-template-columns:1fr}
.obtn{position:relative;padding:16px 10px;border-radius:14px;border:1px solid var(--line2);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));text-align:center;min-height:64px}
.obtn b{display:block;font-family:'Oswald';font-size:16px;font-weight:600;text-transform:uppercase}
.obtn span{display:block;font-family:'Russo One';font-size:13px;color:var(--gold);margin-top:4px}
.obtn.hot{background:linear-gradient(180deg,#ffd25e,#ef9c10);color:#231600;border-color:transparent}
.obtn.freeb{background:linear-gradient(180deg,#5cf0a0,#12a860);color:#00230f;border-color:transparent;padding:20px}
.obtn.dis{opacity:.45;pointer-events:none;filter:grayscale(.6)}
.toggleRow{display:flex;align-items:center;gap:11px;margin-top:15px;font-size:13px;color:var(--mut)}
.sw{width:48px;height:27px;border-radius:99px;background:#232c3d;position:relative;cursor:pointer;flex-shrink:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#7c8798;transition:.28s}
.sw.on{background:rgba(61,220,132,.28)}
.sw.on::after{left:24px;background:var(--green)}
.cprev{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:12px}
.pitem{position:relative;border-radius:13px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.3));border:1px solid var(--line);border-top:3px solid var(--rc)}
.pitem .pimg{height:80px;display:grid;place-items:center;padding:8px}
.pitem .pimg svg{width:100%;max-height:66px}
.pitem .pname{padding:7px 9px 9px;font-size:11px;font-weight:600;line-height:1.28;min-height:44px}
.pitem .pbot{display:flex;justify-content:space-between;padding:0 9px 9px;gap:6px}
.pitem .pprice{font-family:'Russo One';font-size:11.5px;color:var(--rc)}
.pitem .pchg{font-size:10px;color:var(--mut2);background:rgba(0,0,0,.4);padding:2px 6px;border-radius:5px}
.reelbox{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#0a0e17,#070a11);border:1px solid var(--line);height:172px}
.reelbox::before,.reelbox::after{content:'';position:absolute;top:0;bottom:0;width:110px;z-index:5;pointer-events:none}
.reelbox::before{left:0;background:linear-gradient(90deg,#080b12,transparent)}
.reelbox::after{right:0;background:linear-gradient(270deg,#080b12,transparent)}
.reel-track{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;gap:9px;will-change:transform}
.ritem{width:158px;height:150px;flex-shrink:0;border-radius:12px;position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(0,0,0,.35));border:1px solid rgba(255,255,255,.09);border-bottom:3px solid var(--rc);display:grid;place-items:center;padding:9px}
.ritem svg{width:100%;height:92px;position:relative;z-index:2}
.ritem .rname{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:600;padding:0 6px;z-index:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dfe6f2}
.ritem.hit{border-color:#fff;box-shadow:0 0 30px -4px var(--rc)}
.reelbox.multi{height:140px}
.reelbox.multi .ritem{width:120px;height:116px}
.reelbox.multi .ritem svg{height:66px}
.marker{position:absolute;left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%);z-index:8;background:linear-gradient(180deg,transparent,var(--gold),transparent)}
.mask{position:fixed;inset:0;z-index:600;background:rgba(3,5,10,.82);backdrop-filter:blur(9px);display:grid;place-items:center;padding:22px;animation:fadeIn .28s ease both;overflow-y:auto}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{position:relative;width:100%;max-width:940px;border-radius:22px;background:linear-gradient(180deg,#161d2c,#0c1119);border:1px solid var(--line2);animation:mIn .42s cubic-bezier(.2,1.2,.35,1) both;max-height:92vh;display:flex;flex-direction:column}
@keyframes mIn{from{opacity:0;transform:translateY(34px) scale(.94)}to{opacity:1;transform:none}}
.modal.sm{max-width:480px}.modal.md{max-width:700px}
.mhead{display:flex;align-items:center;gap:14px;padding:19px 24px;border-bottom:1px solid var(--line);flex-shrink:0}
.mhead h3{font-size:19px;text-transform:uppercase;font-weight:600}
.mhead .x{margin-left:auto;width:38px;height:38px;border-radius:9px;background:rgba(255,255,255,.06);display:grid;place-items:center;color:var(--mut);flex-shrink:0}
.mbody{padding:24px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.mfoot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;flex-shrink:0}
.omStage{padding:22px 22px 6px;display:flex;flex-direction:column;gap:14px}
.omReels{display:flex;flex-direction:column;gap:12px}
.resGrid{display:grid;gap:14px;padding:6px 22px 0}
.resGrid.c1{grid-template-columns:1fr;max-width:330px;margin:0 auto;width:100%}
.resGrid.c2{grid-template-columns:repeat(2,1fr)}
.resGrid.c3{grid-template-columns:repeat(3,1fr)}
.resGrid.c4,.resGrid.c5{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.rcard{position:relative;border-radius:16px;overflow:hidden;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.4));border:1px solid var(--rc);box-shadow:0 0 34px -10px var(--rc);animation:rcIn .55s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i,0)*110ms)}
@keyframes rcIn{from{opacity:0;transform:translateY(26px) scale(.86)}to{opacity:1;transform:none}}
.rcard .rimg{height:132px;display:grid;place-items:center;padding:14px;position:relative;z-index:2}
.rcard .rimg svg{width:100%;max-height:104px}
.rcard .rtxt{padding:0 12px 14px;position:relative;z-index:2}
.rcard .rrar{font-family:'Oswald';font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--rc);font-weight:600}
.rcard .rnm{font-size:13px;font-weight:600;margin:3px 0 7px}
.rcard .rpr{font-family:'Russo One';font-size:17px}
.omSum{text-align:center;padding:14px 22px 0;font-size:13px;color:var(--mut)}
.omSum b{font-family:'Russo One';font-size:19px;color:var(--green);margin-left:7px}
.spark{position:fixed;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:900}
.welWrap{position:relative;text-align:center;padding:36px 26px 26px}
.welGift{position:relative;font-size:70px;line-height:1;animation:gPop .85s cubic-bezier(.2,1.7,.4,1) both}
@keyframes gPop{0%{transform:scale(.1);opacity:0}60%{transform:scale(1.18);opacity:1}100%{transform:none}}
.welAmt{position:relative;font-family:'Russo One';font-size:clamp(36px,8vw,62px);margin-top:6px;background:linear-gradient(96deg,#ffd25e,#ff7a1a 55%,#ff2fb9);-webkit-background-clip:text;background-clip:text;color:transparent}
.welSub{position:relative;font-family:'Oswald';font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut2);margin-top:8px}
.welT{position:relative;font-size:22px;text-transform:uppercase;font-weight:700;font-family:'Oswald';margin-top:2px}
.upgGrid{display:grid;grid-template-columns:1fr 300px 1fr;gap:20px;align-items:stretch}
.upgCard{border-radius:18px;padding:20px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);min-height:290px;display:flex;flex-direction:column}
.upgCard .lbl{font-family:'Oswald';font-size:11.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--mut2);margin-bottom:12px}
.upgSlot{flex:1;border-radius:14px;border:2px dashed rgba(255,255,255,.13);display:grid;place-items:center;cursor:pointer;min-height:170px;padding:14px}
.upgSlot.filled{border-style:solid;border-color:var(--rc,#333)}
.upgSlot .ph{text-align:center;color:var(--mut2);font-size:13px}
.upgSlot .nm{font-size:12.5px;font-weight:600;margin-top:9px;text-align:center}
.upgSlot .vl{font-family:'Russo One';font-size:16px;margin-top:3px;text-align:center}
.upgMid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.wheelWrap{position:relative;width:262px;height:262px}
.wheelWrap svg{width:100%;height:100%;overflow:visible}
.wheelWrap .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.wheelWrap .ctr b{font-family:'Russo One';font-size:38px;display:block}
.wheelWrap .ctr span{font-size:10.5px;color:var(--mut2);text-transform:uppercase;letter-spacing:.16em}
.upgHint{font-size:12.5px;color:var(--mut);text-align:center;max-width:280px}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}
.slot{aspect-ratio:1/.92;border-radius:13px;border:2px dashed rgba(255,255,255,.13);display:grid;place-items:center;position:relative;overflow:hidden;padding:6px}
.slot.empty{color:var(--mut2);font-family:'Russo One';font-size:19px;opacity:.5}
.slot.filled{border-style:solid;border-color:var(--rc);animation:slotIn .4s both}
@keyframes slotIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.slot.filled svg{width:100%;max-height:52px}
.slot .rm{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:6px;background:rgba(0,0,0,.6);display:grid;place-items:center;font-size:11px;color:#ff8b96;z-index:3}
.slot .sname{position:absolute;bottom:3px;left:3px;right:3px;font-size:8.5px;text-align:center;overflow:hidden;white-space:nowrap;color:#c3ccdb}
.slot.burning{animation:burn .7s ease-in forwards}
@keyframes burn{0%{transform:scale(1)}60%{transform:scale(1.16);filter:brightness(2.4)}100%{transform:scale(.05);opacity:0}}
.pickList{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;max-height:390px;overflow-y:auto;padding-right:5px}
.pickItem{border-radius:11px;padding:8px 6px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.28));border:1px solid var(--line);border-bottom:3px solid var(--rc);cursor:pointer;text-align:center;min-height:44px}
.pickItem.used{opacity:.28;pointer-events:none;filter:grayscale(1)}
.pickItem svg{width:100%;height:44px}
.pickItem .n{font-size:9.5px;font-weight:600;margin-top:5px;line-height:1.2;height:23px;overflow:hidden}
.pickItem .v{font-family:'Russo One';font-size:10.5px;color:var(--rc)}
.invGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:16px}
.icard{position:relative;border-radius:15px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.35));border:1px solid var(--line);border-top:3px solid var(--rc)}
.icard .iimg{height:104px;display:grid;place-items:center;padding:12px}
.icard .iimg svg{width:100%;max-height:82px}
.icard .inm{padding:9px 12px 0;font-size:12.5px;font-weight:600;line-height:1.3;min-height:38px}
.icard .irar{padding:0 12px;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--rc);font-family:'Oswald';font-weight:600}
.icard .iacts{display:flex;gap:6px;padding:11px 12px 13px}
.icard .iacts button{flex:1;padding:10px 6px;border-radius:9px;font-family:'Oswald';font-size:11px;font-weight:600;text-transform:uppercase;border:1px solid var(--line2);background:rgba(255,255,255,.05);min-height:40px}
.icard.gone{opacity:.35;filter:grayscale(1);pointer-events:none}
.icard .stamp{position:absolute;top:8px;right:8px;z-index:4;padding:3px 8px;border-radius:6px;font-family:'Oswald';font-size:9.5px;text-transform:uppercase;background:rgba(0,0,0,.7);border:1px solid var(--line2)}
.empty{padding:60px 20px;text-align:center;color:var(--mut2)}
.empty b{display:block;font-family:'Oswald';font-size:19px;color:var(--mut);text-transform:uppercase;margin-bottom:7px}
.profTop{display:flex;gap:22px;align-items:center;padding:26px;border-radius:20px;background:linear-gradient(120deg,#132a22,#0d1220 60%);border:1px solid var(--line);flex-wrap:wrap}
.pava{width:96px;height:96px;border-radius:22px;background:conic-gradient(from 200deg,#3ddc84,#22d3ee,#ffb62e,#3ddc84);padding:3px;flex-shrink:0}
.pava div{width:100%;height:100%;border-radius:19px;background:#0c111c;display:grid;place-items:center;font-family:'Russo One';font-size:34px}
.pinfo{flex:1;min-width:200px}
.pinfo h2{font-size:27px;text-transform:uppercase;font-weight:600}
.statGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:15px}
.stat{border-radius:16px;padding:19px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sc)}
.stat .sl{font-size:11px;color:var(--mut2);text-transform:uppercase;letter-spacing:.13em;font-family:'Oswald'}
.stat .sv{font-family:'Russo One';font-size:24px;margin-top:7px;color:#fff}
.stat .ss{font-size:11.5px;color:var(--mut);margin-top:2px}
.histWrap{overflow-x:auto}
.histTable{width:100%;border-collapse:collapse;min-width:520px}
.histTable th{text-align:left;font-family:'Oswald';font-size:11px;text-transform:uppercase;color:var(--mut2);padding:9px 13px;border-bottom:1px solid var(--line)}
.histTable td{padding:11px 13px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
.histTable .tw{width:56px}
.histTable .tw svg{width:100%;height:32px}
.livePanel{border-radius:18px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);overflow:hidden}
.livePanel .lp-h{display:flex;align-items:center;gap:9px;padding:14px 17px;border-bottom:1px solid var(--line)}
.livePanel .lp-h b{font-family:'Oswald';font-size:13.5px;text-transform:uppercase;font-weight:600}
.livePanel .lp-h i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulseDot 1.4s infinite}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.2);opacity:.7}}
.liveList{max-height:432px;overflow:hidden;padding:8px}
.ldrop{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;margin-bottom:4px;background:rgba(255,255,255,.022);border-left:3px solid var(--rc)}
.ldrop .lw{width:52px;height:34px;flex-shrink:0}
.ldrop .lw svg{width:100%;height:100%}
.ldrop .lt{flex:1;min-width:0}
.ldrop .lt b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldrop .lt span{font-size:11px;color:var(--mut2)}
.ldrop .lp{font-family:'Russo One';font-size:12.5px;color:var(--rc);flex-shrink:0}
.twoCol{display:grid;grid-template-columns:minmax(0,1fr) 328px;gap:22px;align-items:start}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:20px;align-items:start}
.bcard{border-radius:20px;padding:22px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);position:relative;overflow:hidden}
.bcard h3{font-size:18px;text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:9px;margin-bottom:5px}
.bcard .bsub{font-size:12.5px;color:var(--mut);margin-bottom:16px}
.streak{display:flex;gap:7px;flex-wrap:wrap}
.sday{flex:1;min-width:52px;padding:11px 5px;border-radius:12px;text-align:center;background:rgba(255,255,255,.035);border:1px solid var(--line);position:relative}
.sday b{display:block;font-family:'Russo One';font-size:13px;color:var(--gold)}
.sday span{display:block;font-size:9.5px;color:var(--mut2);text-transform:uppercase;margin-bottom:4px}
.sday.done{background:rgba(61,220,132,.14);border-color:rgba(61,220,132,.4)}
.sday.done::after{content:'✔';position:absolute;inset:0;display:grid;place-items:center;font-size:20px;color:var(--green);background:rgba(6,10,16,.55);border-radius:12px}
.sday.cur{border-color:var(--gold);background:rgba(255,182,46,.13)}
.qrow{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:13px;background:rgba(255,255,255,.032);border:1px solid var(--line);margin-bottom:9px}
.qrow .qi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.06);flex-shrink:0}
.qrow .qt{flex:1;min-width:0}
.qrow .qt b{display:block;font-size:13.5px;font-weight:600}
.qrow .qt span{display:block;font-size:11.5px;color:var(--mut2)}
.qrow .qbar{height:5px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:6px}
.qrow .qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan))}
.qrow .qr{text-align:right;flex-shrink:0}
.qrow .qr em{font-style:normal;display:block;font-family:'Russo One';font-size:13px;color:var(--gold);margin-bottom:5px}
.qrow.claimed{opacity:.45}
.promoRow{display:flex;gap:9px}
.promoRow input{flex:1;min-width:0;padding:12px 15px;border-radius:11px;background:rgba(0,0,0,.35);border:1px solid var(--line2);color:#fff;font-size:16px;outline:none}
.hintList{list-style:none;display:grid;gap:9px}
.hintList li{display:flex;gap:9px;font-size:12.5px;color:var(--mut)}
.hintList li b{color:var(--green);flex-shrink:0}
.lwWrap{position:relative;width:262px;height:262px;margin:4px auto 14px}
.lwDisc{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 8px #141b28,0 0 56px -10px rgba(255,182,46,.55);will-change:transform}
.lwPtr{position:absolute;left:50%;top:-14px;transform:translateX(-50%);border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--gold);z-index:6}
.lwHub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:50%;background:#0d1220;border:2px solid rgba(255,255,255,.16);display:grid;place-items:center;z-index:5;text-align:center;font-size:9px;color:var(--mut);font-family:'Oswald';text-transform:uppercase}
.lwHub b{display:block;font-family:'Russo One';font-size:14px;color:#fff}
.lwLab{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a))}
.lwLab span{position:absolute;left:-46px;top:-108px;width:92px;text-align:center;font-size:11.5px;font-weight:700;color:#fff}
.tokenChip{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:99px;background:rgba(34,211,238,.13);border:1px solid rgba(34,211,238,.4);color:#9ceeff;font-size:12.5px;font-weight:600}
.tokenChip b{font-family:'Russo One'}
.startCard{border-radius:20px;padding:20px 22px;margin-bottom:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(120deg,rgba(255,182,46,.16),rgba(255,47,185,.07) 55%,rgba(10,16,26,.9));border:1px solid rgba(255,182,46,.38)}
.startCard .sic{font-size:38px}
.startCard>div{flex:1;min-width:200px}
.startCard h3{font-size:19px;text-transform:uppercase;font-weight:600}
.startCard p{font-size:13px;color:var(--mut);margin-top:3px}
.startCard .amt{margin-left:auto;font-family:'Russo One';font-size:30px;color:var(--gold)}
#toasts{position:fixed;top:82px;right:20px;z-index:900;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{min-width:250px;max-width:340px;padding:13px 16px;border-radius:13px;background:linear-gradient(180deg,#1a2231,#10151f);border:1px solid var(--line2);border-left:4px solid var(--tc);display:flex;gap:11px;align-items:center;animation:tIn .42s cubic-bezier(.2,1.3,.4,1) both;pointer-events:auto}
.toast.out{animation:tOut .32s ease forwards}
@keyframes tIn{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
@keyframes tOut{to{opacity:0;transform:translateX(70px)}}
.toast .ti{font-size:19px;flex-shrink:0}
.toast b{display:block;font-size:13.5px;font-weight:600}
.toast span{display:block;font-size:12px;color:var(--mut)}
.wsvg{display:block;overflow:visible;width:100%;height:100%}
footer{position:relative;z-index:5;border-top:1px solid var(--line);margin-top:44px}
.fwrap{max-width:1560px;margin:0 auto;padding:34px 22px;display:flex;gap:30px;flex-wrap:wrap;align-items:center}
.fwrap .fc{color:var(--mut2);font-size:12.5px;flex:1;min-width:230px}
.fwrap .fl{display:flex;gap:18px;flex-wrap:wrap}
.fwrap .fl a{font-size:12.5px;color:var(--mut);cursor:pointer}
.ageban{padding:5px 11px;border-radius:7px;border:2px solid var(--red);color:var(--red);font-family:'Russo One';font-size:12px}
.mobnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:300;background:rgba(8,11,18,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sab))}
.mobnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:8.5px;color:var(--mut2);font-family:'Oswald';text-transform:uppercase;border-radius:9px;min-height:48px;justify-content:center}
.mobnav button.on{color:var(--gold);background:rgba(255,182,46,.1)}
.mobnav button svg{width:20px;height:20px}
.mobAct{display:none;position:fixed;left:0;right:0;bottom:calc(60px + var(--sab));z-index:290;padding:10px 12px 12px;gap:8px;background:linear-gradient(180deg,transparent,rgba(6,8,14,.96) 42%)}
.mobAct .btn{flex:1;min-width:0}
/* BATTLE */
.battleArena{padding:24px;background:linear-gradient(180deg,#0d1320,#06080e);border-radius:18px;border:1px solid var(--line2);position:relative;overflow:hidden}
.baPlayers{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;margin-bottom:20px}
.baPlayer{border-radius:16px;padding:18px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.2));border:1px solid var(--line2);text-align:center;transition:.4s}
.baPlayer.winner{border-color:var(--gold);box-shadow:0 0 40px -8px rgba(255,182,46,.55)}
.baPlayer.loser{opacity:.5;filter:grayscale(.6)}
.baPlayer .bapName{font-family:'Oswald';font-size:16px;font-weight:600;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.baPlayer .bapName i{width:8px;height:8px;border-radius:50%}
.baPlayer .bapTotal{font-family:'Russo One';font-size:26px;color:var(--gold);min-height:34px}
.bapTotal.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
.baVs{display:grid;place-items:center;font-family:'Russo One';font-size:22px;color:var(--red)}
.baReels{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.baReel{background:linear-gradient(180deg,#0a0e17,#070a11);border-radius:14px;border:1px solid var(--line);overflow:hidden;position:relative;height:150px}
.baReel .baReelLbl{position:absolute;top:6px;left:10px;z-index:5;font-family:'Oswald';font-size:10px;text-transform:uppercase;color:var(--mut);background:rgba(0,0,0,.65);padding:3px 8px;border-radius:5px}
.baReel .reel-track{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;gap:7px}
.baReel .ritem{width:128px;height:128px;flex-shrink:0;border-radius:10px;position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.35));border:1px solid rgba(255,255,255,.09);border-bottom:3px solid var(--rc);display:grid;place-items:center;padding:8px}
.baReel .ritem svg{width:100%;height:78px;position:relative;z-index:2}
.baReel .ritem .rname{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:9.5px;font-weight:600;padding:0 5px;z-index:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dfe6f2}
.baReel::before,.baReel::after{content:'';position:absolute;top:0;bottom:0;width:50px;z-index:4;pointer-events:none}
.baReel::before{left:0;background:linear-gradient(90deg,#080b12,transparent)}
.baReel::after{right:0;background:linear-gradient(270deg,#080b12,transparent)}
.baReel .marker{position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);z-index:6;background:linear-gradient(180deg,transparent,var(--gold),transparent)}
.baResult{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.baResCard{padding:20px;border-radius:16px;text-align:center;overflow:hidden}
.baResCard.winner{background:linear-gradient(180deg,rgba(255,182,46,.18),rgba(255,182,46,.03));border:2px solid var(--gold)}
.baResCard.loser{background:linear-gradient(180deg,rgba(255,77,94,.1),rgba(255,77,94,.02));border:2px solid var(--red);opacity:.8}
.baResCard .barCrown{font-size:32px;margin-bottom:6px}
.baResCard .barTag{font-family:'Oswald';font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px}
.baResCard.winner .barTag{color:var(--gold)}
.baResCard.loser .barTag{color:var(--red)}
.baResCard .barNick{font-family:'Oswald';font-size:17px;font-weight:600;text-transform:uppercase;margin-bottom:10px}
.baResCard .barAmt{font-family:'Russo One';font-size:30px}
.baResCard.winner .barAmt{color:var(--gold)}
.baResCard.loser .barAmt{color:var(--red)}
.baResCard .barDrops{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.baResCard .barDrops .bd{width:40px;height:40px;border-radius:7px;background:rgba(0,0,0,.35);padding:3px;border:1px solid var(--line2)}
.baResCard .barDrops .bd svg{width:100%;height:100%}
.baProgress{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:16px;font-family:'Oswald';font-size:12px;text-transform:uppercase;color:var(--mut)}
.baProgress i{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.baProgress i.on{background:var(--gold)}
.baProgress i.done{background:var(--green)}
.btCases{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;max-height:280px;overflow-y:auto;padding:4px}
.btCase{padding:10px 6px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid var(--line);cursor:pointer;text-align:center;position:relative;min-height:60px}
.btCase.sel{background:linear-gradient(180deg,rgba(255,182,46,.18),rgba(255,182,46,.03));border-color:var(--gold)}
.btCase.dis{opacity:.4;pointer-events:none}
.btCase svg{width:100%;height:48px;margin-bottom:5px}
.btCase .n{font-size:10.5px;font-weight:600;line-height:1.2;min-height:26px}
.btCase .p{font-family:'Russo One';font-size:10px;color:var(--gold);margin-top:3px}
.btCase .cnt{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:#231600;font-family:'Russo One';font-size:11px;display:grid;place-items:center;padding:0 5px}
.btSummary{padding:14px;border-radius:13px;background:rgba(0,0,0,.35);border:1px solid var(--line);margin-top:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btSummary .bts-l{font-size:12px;color:var(--mut2);text-transform:uppercase;font-family:'Oswald'}
.btSummary .bts-v{font-family:'Russo One';font-size:17px;color:var(--gold)}

function skinPaint(S,id,w,h){
const R=seeded(S.n+S.base);let defs='',body='';
const bg=f=>`<rect x="-10" y="-10" width="${w+20}" height="${h+20}" fill="${f}"/>`;
switch(S.pat){
case 'solid':defs+=`<linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${S.c[0]}"/><stop offset=".48" stop-color="${S.base}"/><stop offset="1" stop-color="${S.c[1]}"/></linearGradient>`;body=bg(`url(#g${id})`);break;
case 'fade':{const st=S.c.length;defs+=`<linearGradient id="g${id}" x1="0" y1="0" x2="1" y2=".35"><stop offset="0" stop-color="${S.base}"/>${S.c.map((c,i)=>`<stop offset="${((i+1)/(st+.6)).toFixed(2)}" stop-color="${c}"/>`).join('')}<stop offset="1" stop-color="${S.base}"/></linearGradient>`;body=bg(`url(#g${id})`);break}
case 'stripes':defs+=`<pattern id="p${id}" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><rect width="34" height="34" fill="${S.base}"/><rect width="14" height="34" fill="${S.c[0]}"/><rect x="18" width="4" height="34" fill="${S.c[1]}" opacity=".8"/></pattern>`;body=bg(`url(#p${id})`);break;
case 'camo':{let b='';for(let i=0;i<26;i++){const cx=R()*w,cy=R()*h,rx=8+R()*30,ry=6+R()*20;b+=`<ellipse cx="${cx|0}" cy="${cy|0}" rx="${rx|0}" ry="${ry|0}" fill="${R()>.5?S.c[0]:S.c[1]}" opacity="${(.4+R()*.5).toFixed(2)}"/>`}body=bg(S.base)+b;break}
case 'geo':{let g='';for(let i=0;i<20;i++){const x=R()*w,y=R()*h,s=10+R()*38,col=i%3===0?(S.c[1]||S.c[0]):S.c[0];g+=R()>.45?`<rect x="${x|0}" y="${y|0}" width="${s|0}" height="${(s*.45)|0}" fill="${col}" opacity="${(.35+R()*.5).toFixed(2)}"/>`:`<polygon points="${x|0},${y|0} ${(x+s)|0},${(y+s*.5)|0} ${x|0},${(y+s)|0}" fill="${col}" opacity="${(.3+R()*.5).toFixed(2)}"/>`}body=bg(S.base)+g;break}
case 'marble':{for(let i=0;i<4;i++)defs+=`<radialGradient id="m${id}${i}" cx="${R().toFixed(2)}" cy="${R().toFixed(2)}" r=".75"><stop offset="0" stop-color="${S.c[i%S.c.length]}" stop-opacity=".95"/><stop offset="1" stop-color="${S.c[(i+1)%S.c.length]}" stop-opacity="0"/></radialGradient>`;body=bg(S.base);for(let i=0;i<4;i++)body+=`<rect x="-10" y="-10" width="${w+20}" height="${h+20}" fill="url(#m${id}${i})"/>`;break}
case 'flame':{let f='';for(let i=0;i<7;i++){const y=R()*h,len=(.35+R()*.6)*w,col=i%2?S.c[0]:(S.c[1]||S.c[0]);f+=`<path d="M${w} ${y|0} C ${(w-len*.6)|0} ${(y-22)|0} ${(w-len*.7)|0} ${(y+26)|0} ${(w-len)|0} ${y|0} C ${(w-len*.66)|0} ${(y+12)|0} ${(w-len*.5)|0} ${(y-8)|0} ${w} ${(y+9)|0} Z" fill="${col}" opacity=".82"/>`}body=bg(S.base)+f;break}
case 'tiger':{let t='';for(let i=0;i<16;i++){const x=R()*w,y=R()*h;t+=`<path d="M${x|0} ${y|0} q ${(10+R()*20)|0} ${(R()*16-8)|0} ${(26+R()*34)|0} ${(R()*10-5)|0} l 0 ${(5+R()*7)|0} q ${(-24-R()*20)|0} ${(R()*10)|0} ${(-28-R()*18)|0} 0 Z" fill="${S.c[0]}" opacity=".9"/>`}body=bg(S.base)+t;break}
case 'digital':defs+=`<pattern id="p${id}" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="${S.base}"/><rect width="8" height="8" fill="${S.c[0]}" opacity=".85"/><rect x="8" y="8" width="8" height="8" fill="${S.c[1]||S.c[0]}" opacity=".6"/></pattern>`;body=bg(`url(#p${id})`);break;
default:body=bg(S.base)}
defs+=`<linearGradient id="s${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/><stop offset=".78" stop-color="#000" stop-opacity=".2"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></linearGradient>`;
body+=`<rect x="-10" y="-10" width="${w+20}" height="${h+20}" fill="url(#s${id})"/>`;
return{defs,body}}
function weaponSVG(wt,sk){

const arena=m.querySelector('.battleArena');
const prog=$('#baProg');
let sum1=0,sum2=0;
const ease=p=>1-Math.pow(1-p,5);
async function playRound(i){
const it1=ITEM(r1.drops[i]),it2=ITEM(r2.drops[i]);
if(!it1||!it2)return;
Sound.round();
$('#baRoundLbl').innerHTML=`<span style="color:var(--gold)">Раунд ${i+1}</span> из ${rounds}`;

const r1el=$('#baR1'),r2el=$('#baR2');
const t1=r1el.querySelector('.reel-track'),t2=r2el.querySelector('.reel-track');
const TOTAL=40,WIN=30;
function build(track,winIt){let html='';
for(let k=0;k<TOTAL;k++){const it=k===WIN?winIt:pick(ITEMS);
html+=`<div class="ritem" style="--rc:${RAR[it.rar].c}">${weaponSVG(it.wt,it.sk)}<div class="rname">${it.name}</div></div>`}
track.innerHTML=html}
build(t1,it1);build(t2,it2);
r1el.style.boxShadow='';r2el.style.boxShadow='';
await new Promise(resolve=>{
const iw1=t1.querySelector('.ritem').offsetWidth+(parseFloat(getComputedStyle(t1).gap)||7);
const iw2=t2.querySelector('.ritem').offsetWidth+(parseFloat(getComputedStyle(t2).gap)||7);
const bw1=r1el.offsetWidth,bw2=r2el.offsetWidth;
const tg1=WIN*iw1+iw1/2-bw1/2+rnd(-iw1*.2,iw1*.2);
const tg2=WIN*iw2+iw2/2-bw2/2+rnd(-iw2*.2,iw2*.2);
const dur=IS_MOBILE?3600:4400;let t0=null;
(function frame(t){if(!t0)t0=t;
const p=clamp((t-t0)/dur,0,1),e=ease(p);
t1.style.transform=`translate3d(${-e*tg1}px,0,0)`;
t2.style.transform=`translate3d(${-e*tg2}px,0,0)`;
if(p<1)requestAnimationFrame(frame);
else{t1.style.transform=`translate3d(${-tg1}px,0,0)`;t2.style.transform=`translate3d(${-tg2}px,0,0)`;
const h1=t1.querySelectorAll('.ritem')[WIN];if(h1)h1.classList.add('hit');
const h2=t2.querySelectorAll('.ritem')[WIN];if(h2)h2.classList.add('hit');
r1el.style.boxShadow=`inset 0 0 34px -8px ${RAR[it1.rar].c}`;
r2el.style.boxShadow=`inset 0 0 34px -8px ${RAR[it2.rar].c}`;
Sound.tone(680,.13,'triangle',.055);
setTimeout(resolve,620)}})(performance.now())});
sum1+=it1.price;sum2+=it2.price;
$('#baT1').textContent=fmt(sum1);$('#baT2').textContent=fmt(sum2);
$('#baT1').classList.remove('bump');void $('#baT1').offsetWidth;$('#baT1').classList.add('bump');
$('#baT2').classList.remove('bump');void $('#baT2').offsetWidth;$('#baT2').classList.add('bump');
if(dot)dot.classList.add('done');
await new Promise(r=>setTimeout(r,550))}
for(let i=0;i<rounds;i++)await playRound(i);
const winner=res.winner;
const w=winner===p1?r1:r2,l=winner===p1?r2:r1;
const wPid=winner,lPid=winner===p1?p2:p1;
$('#baP1').classList.add(winner===p1?'winner':'loser');
$('#baP2').classList.add(winner===p2?'winner':'loser');
$('#baRoundLbl').innerHTML=`<span style="color:var(--gold);font-size:14px">🏆 ПОБЕДИТЕЛЬ: ${w.nick}</span>`;
const totalPrize=w.total+l.total;
arena.insertAdjacentHTML('beforeend',`
<div class="baResult" style="margin-top:16px">
<div class="baResCard winner"><div class="barCrown">👑</div><div class="barTag">ПОБЕДИТЕЛЬ</div>
<div class="barNick">${w.nick}${isMe(wPid)?' (ты)':''}</div>
<div class="barAmt mono" id="barAmt1">0 ₽</div>
<div class="barDrops">${w.drops.map(id=>{const it=ITEM(id);return it?`<div class="bd" style="border-color:${RAR[it.rar].c}">${weaponSVG(it.wt,it.sk)}</div>`:''}).join('')}</div></div>
<div class="baResCard loser"><div class="barCrown">💀</div><div class="barTag">ПРОИГРАЛ</div>
<div class="barNick">${l.nick}${isMe(lPid)?' (ты)':''}</div>
<div class="barAmt mono" id="barAmt2">${fmt(l.total)}</div></div></div>`);
Sound.fanfare();burst(arena,'#ffd700',80);
const amt1=$('#barAmt1');let t0=null;
(function count(t){if(!t0)t0=t;
const p=clamp((t-t0)/2000,0,1),e=1-Math.pow(1-p,3);
amt1.textContent='+'+fmtN(Math.round(totalPrize*e))+' ₽';
if(p<1)requestAnimationFrame(count);else amt1.textContent='+'+fmtN(totalPrize)+' ₽'})(performance.now());
const foot=$('#baFoot');foot.style.display='flex';
const canClaim=String(winner)===uid_&&winner!=='bot'&&!res.claimed.includes(uid_);
foot.innerHTML=`${canClaim?`<button class="btn btn-gr" id="baClaim">🎒 Забрать весь дроп</button>`:''}
<button class="btn btn-gh" onclick="closeModal()">Закрыть</button>
<button class="btn btn-cy" onclick="closeModal();go('battle')">🔁 Ещё</button>`;
const cl=$('#baClaim');
if(cl)cl.onclick=async()=>{try{await api('/api/battles/'+bid+'/claim',{ok:1});

await syncFromServer()}catch(e){toast('Ошибка',e.message,'err')}}}

const API='';
let token=localStorage.getItem('cf_token')||null;
async function api(path,body){
const res=await fetch(API+path,{method:body?'POST':'GET',
headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},
body:body?JSON.stringify(body):undefined});
if(res.status===401){token=null;localStorage.removeItem('cf_token');showAuth('login');throw new Error('Требуется вход')}
if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.detail||'Ошибка сервера')}
return res.json()}
const myId=()=>{try{return JSON.parse(atob(token.split('.')[1])).uid}catch(e){return null}};
function showAuth(mode='login'){
closeModal(true);
const isLogin=mode==='login';
const m=modal(`<div class="mhead"><h3>${isLogin?'🔑 Вход':'📝 Регистрация'}</h3></div>
<div class="mbody" style="display:grid;gap:11px">

<input id="aPass" type="password" placeholder="Пароль" style="padding:12px 15px;border-radius:11px;background:rgba(0,0,0,.35);border:1px solid var(--line2);color:#fff;font-size:16px;outline:none">
<div id="aErr" style="color:var(--red);font-size:13px;min-height:16px"></div></div>
<div class="mfoot"><button class="btn btn-gh" id="aSwap">${isLogin?'Регистрация':'Вход'}</button>
<button class="btn btn-gold" id="aGo">${isLogin?'Войти':'Создать'}</button></div>`,'sm');
m.querySelector('.modal').dataset.lock='1';
$('#aSwap').onclick=()=>{Sound.click();showAuth(isLogin?'reg':'login')};
const submit=async()=>{
const nick=$('#aNick').value.trim(),pass=$('#aPass').value;
if(!nick||!pass){$('#aErr').textContent='Заполни оба поля';return}
$('#aGo').disabled=true;$('#aErr').textContent='';
try{const r=await api('/api/'+(isLogin?'login':'register'),{nick,password:pass});
token=r.token;localStorage.setItem('cf_token',token);
closeModal(true);await bootRemote();afterBoot();
api('/api/ping',{ok:1}).catch(()=>{});
toast(isLogin?'✅ С возвращением':'✅ Аккаунт создан',r.nick,'ok')}
catch(e){$('#aErr').textContent=e.message||'Ошибка';$('#aGo').disabled=false}};
$('#aGo').onclick=submit;
$('#aPass').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
$('#aNick').addEventListener('keydown',e=>{if(e.key==='Enter')$('#aPass').focus()})}
async function bootRemote(){
let st=null;
for(let i=0;i<3&&!st;i++){
try{st=await api('/api/state')}
catch(e){st=null;if(/вход/i.test(e.message||''))throw e;if(i<2)await new Promise(r=>setTimeout(r,1200))}}
const local=load();
if(st){if((st.syncTs||0)>=(local.syncTs||0))State=Object.assign(JSON.parse(JSON.stringify(DEF)),st);
else{State=Object.assign(JSON.parse(JSON.stringify(DEF)),local);pushState()}}
else{State=Object.assign(JSON.parse(JSON.stringify(DEF)),local);_offline=true}
balShown=0;_booted=true}
async function syncFromServer(){await bootRemote();render()}
function logout(){token=null;localStorage.removeItem('cf_token');location.reload()}
/* BOOT */
buildNav();Live.renderTicker();
function afterBoot(){
const firstVisit=!State.welcome;
render();checkQuests();
if(firstVisit){State.welcome=true;State.balance=START_BALANCE;save();balShown=0;setTimeout(showWelcome,420)}
else updateBal()}
if(token){bootRemote().then(afterBoot).catch(()=>{render()});api('/api/ping',{ok:1}).catch(()=>{})}
else{render();showAuth('login')}
function sndIcon(on){return on?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>'
:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>'}
Sound.on=State.sound!==false;
$('#sndBtn').innerHTML=sndIcon(Sound.on);$('#sndBtn').classList.toggle('act',Sound.on);
$('#sndBtn').onclick=()=>{Sound.on=!Sound.on;State.sound=Sound.on;save();
$('#sndBtn').classList.toggle('act',Sound.on);$('#sndBtn').innerHTML=sndIcon(Sound.on);if(Sound.on)Sound.click()};
setInterval(()=>Live.tick(),3200);
setInterval(tickCD,1000);
setInterval(()=>{if(token)api('/api/ping',{ok:1}).catch(()=>{})},20000);
document.addEventListener('click',()=>Sound.init(),{once:true});
document.addEventListener('touchstart',()=>Sound.init(),{once:true,passive:true});
</script>
