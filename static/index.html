<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06080e">
<title>CASEFORGE — бесплатные кейсы CS2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/oswald@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/oswald@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/oswald@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/oswald@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/exo-2@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/exo-2@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/russo-one@5/400.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#06080e;--panel:#101521;--panel2:#151c2a;--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.14);
--txt:#e9edf6;--mut:#8792a6;--mut2:#5f6a7d;
--gold:#ffb62e;--cyan:#22d3ee;--pink:#ff2fb9;--green:#3ddc84;--red:#ff4d5e;
--sh:0 18px 50px -12px rgba(0,0,0,.85);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:'Exo 2',system-ui,sans-serif;font-size:15px;line-height:1.45;overflow-x:hidden;overscroll-behavior-y:none}
h1,h2,h3,.dsp{font-family:'Oswald',sans-serif;letter-spacing:.02em}
.mono{font-family:'Russo One',sans-serif}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
input,select{font-family:inherit}
img,svg{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#0a0d15}
::-webkit-scrollbar-thumb{background:#232c3d;border-radius:6px;border:2px solid #0a0d15}
html.is-mobile ::-webkit-scrollbar{width:0;height:0}

#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgfx .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.4;animation:orbFloat 22s ease-in-out infinite}
#bgfx .o1{width:640px;height:640px;background:#1b3cff;top:-220px;left:-160px}
#bgfx .o2{width:520px;height:520px;background:#12a860;bottom:-200px;right:-120px;animation-delay:-7s;opacity:.24}
#bgfx .o3{width:460px;height:460px;background:#00e5ff;top:38%;left:52%;animation-delay:-14s;opacity:.15}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(70px,-50px) scale(1.12)}66%{transform:translate(-50px,60px) scale(.92)}}
#bgfx .grid{position:absolute;inset:-2px;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse 100% 70% at 50% 0%,#000 20%,transparent 78%)}

header{position:sticky;top:0;z-index:200;backdrop-filter:blur(18px);background:linear-gradient(180deg,rgba(6,8,14,.94),rgba(6,8,14,.72));border-bottom:1px solid var(--line)}
.hwrap{max-width:1560px;margin:0 auto;padding:0 22px;height:70px;display:flex;align-items:center;gap:22px}
.logo{display:flex;align-items:center;gap:11px;flex-shrink:0;cursor:pointer}
.logo .mark{width:40px;height:40px}
.logo .mark svg{width:100%;height:100%;filter:drop-shadow(0 0 10px rgba(255,182,46,.55))}
.logo .txt{font-family:'Russo One';font-size:19px;line-height:1;letter-spacing:.06em}
.logo .txt b{color:var(--gold)}
.logo .txt span{display:block;font-family:'Exo 2';font-size:8.5px;letter-spacing:.34em;color:var(--mut2);margin-top:4px}
nav{display:flex;gap:3px;margin-left:4px}
nav button{position:relative;padding:10px 14px;border-radius:10px;font-family:'Oswald';font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);transition:.22s;font-weight:500}
nav button:hover{color:#fff;background:rgba(255,255,255,.05)}
nav button.on{color:#fff;background:linear-gradient(180deg,rgba(255,182,46,.16),rgba(255,182,46,.05))}
nav button.on::after{content:'';position:absolute;left:12px;right:12px;bottom:3px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 10px var(--gold)}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px}
.bal{display:flex;align-items:center;gap:9px;background:linear-gradient(180deg,#161d2b,#0f1420);border:1px solid var(--line2);border-radius:12px;padding:7px 13px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.bal .v{font-family:'Russo One';font-size:17px;color:var(--gold);min-width:74px;text-align:right;text-shadow:0 0 16px rgba(255,182,46,.35)}
.bal .v.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22);color:#fff}100%{transform:scale(1)}}
.bal .tk{font-size:10px;color:var(--mut2);letter-spacing:.1em;text-transform:uppercase}
.iconbtn{position:relative;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);display:grid;place-items:center;transition:.2s;color:var(--mut);flex-shrink:0}
.iconbtn:hover{background:rgba(255,255,255,.1);color:#fff}
.iconbtn.act{color:var(--gold);border-color:rgba(255,182,46,.4);background:rgba(255,182,46,.12)}
.iconbtn .bdot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 12px rgba(255,77,94,.8);font-family:'Oswald'}
.avatar{width:40px;height:40px;border-radius:12px;background:conic-gradient(from 210deg,#3ddc84,#22d3ee,#ffb62e,#3ddc84);padding:2px;cursor:pointer;flex-shrink:0}
.avatar div{width:100%;height:100%;border-radius:10px;background:#0d1220;display:grid;place-items:center;font-family:'Russo One';font-size:14px}

.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:12px;font-family:'Oswald';font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;transition:.22s;overflow:hidden;white-space:nowrap;min-height:44px}
.btn:active{transform:scale(.965)}
.btn-gold{background:linear-gradient(180deg,#ffd25e,#f0a113);color:#231600;box-shadow:0 8px 26px -8px rgba(255,182,46,.75),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-gold:hover{box-shadow:0 12px 34px -8px rgba(255,182,46,.95);transform:translateY(-2px)}
.btn-gr{background:linear-gradient(180deg,#5cf0a0,#12a860);color:#00230f;box-shadow:0 8px 26px -10px rgba(61,220,132,.75),inset 0 1px 0 rgba(255,255,255,.35)}
.btn-gr:hover{transform:translateY(-2px)}
.btn-cy{background:linear-gradient(180deg,#4ee6ff,#0aa8c9);color:#00222b}
.btn-cy:hover{transform:translateY(-2px)}
.btn-gh{background:rgba(255,255,255,.055);border:1px solid var(--line2);color:var(--txt)}
.btn-gh:hover{background:rgba(255,255,255,.11)}
.btn-red{background:linear-gradient(180deg,#ff6b78,#d61f31);color:#fff}
.btn:disabled{opacity:.38;pointer-events:none;filter:grayscale(.6)}
.btn.sm{padding:8px 14px;font-size:12px;border-radius:9px;min-height:36px}

main{position:relative;z-index:5;max-width:1560px;margin:0 auto;padding:26px 22px 70px;min-height:70vh}
#app{transition:opacity .18s ease}
#app.fading{opacity:0}
.page{animation:pageIn .4s cubic-bezier(.2,.9,.3,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.reveal{animation:rev .5s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i,0)*30ms)}
@keyframes rev{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}

.sechead{display:flex;align-items:flex-end;gap:16px;margin:34px 0 18px;flex-wrap:wrap}
.sechead h2{font-size:26px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:11px}
.sechead h2::before{content:'';width:5px;height:24px;border-radius:3px;background:linear-gradient(180deg,var(--green),var(--cyan));box-shadow:0 0 14px rgba(61,220,132,.6);flex-shrink:0}
.sechead p{color:var(--mut);font-size:13.5px;margin-bottom:3px}
.sechead .sp{margin-left:auto}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.search{position:relative;flex:1;min-width:200px;max-width:330px}
.search input{width:100%;padding:11px 14px 11px 40px;border-radius:11px;background:rgba(255,255,255,.045);border:1px solid var(--line);color:#fff;font-size:16px;transition:.22s;outline:none}
.search input:focus{border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.06);box-shadow:0 0 0 3px rgba(34,211,238,.1)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--mut2)}
.chip{padding:9px 16px;border-radius:10px;background:rgba(255,255,255,.045);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--mut);transition:.2s;text-transform:uppercase;letter-spacing:.06em;font-family:'Oswald';min-height:38px;white-space:nowrap}
.chip:hover{color:#fff;background:rgba(255,255,255,.09)}
.chip.on{background:linear-gradient(180deg,rgba(61,220,132,.22),rgba(61,220,132,.07));border-color:rgba(61,220,132,.45);color:#a9f5cd}
select.sel{padding:10px 14px;border-radius:11px;background:rgba(255,255,255,.045);border:1px solid var(--line);color:#fff;font-size:16px;outline:none;cursor:pointer;min-height:42px}
select.sel option{background:#131a26}

/* === CASE CARDS (matching screenshots) === */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:20px}
.ccard{position:relative;border-radius:18px;overflow:hidden;cursor:pointer;background:linear-gradient(180deg,#111726,#0d1119 60%);border:1px solid var(--line);transition:transform .35s cubic-bezier(.2,.9,.3,1),box-shadow .35s,border-color .35s;display:flex;flex-direction:column}
.ccard::before{content:'';position:absolute;inset:0;opacity:0;transition:.4s;pointer-events:none;background:radial-gradient(80% 60% at 50% 0%,var(--acc-a),transparent 70%)}
.ccard:hover{transform:translateY(-9px);border-color:var(--acc);box-shadow:0 26px 50px -20px rgba(0,0,0,.9),0 0 40px -14px var(--acc)}
.ccard:hover::before{opacity:1}
.ccard.locked{filter:grayscale(.5) brightness(.75)}
.ccard .cbadge{position:absolute;top:12px;left:12px;z-index:4;padding:4px 10px;border-radius:7px;font-family:'Oswald';font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.55);border:1px solid var(--line2);backdrop-filter:blur(6px)}
.ccard .chot{background:linear-gradient(90deg,#ff2fb9,#ff6a00);border-color:transparent;color:#fff}
.ccard .cnew{background:linear-gradient(90deg,#22d3ee,#4b69ff);border-color:transparent;color:#fff}
.ccard .ctop{background:linear-gradient(90deg,#ffd25e,#f0a113);border-color:transparent;color:#231600}
.ccard .cimg{height:196px;display:grid;place-items:center;position:relative;z-index:2;padding:14px}
.ccard .cimg .glow{position:absolute;width:190px;height:190px;border-radius:50%;filter:blur(34px);opacity:.42;background:var(--acc);transition:.4s}
.ccard:hover .cimg .glow{opacity:.75;transform:scale(1.16)}
.ccard .cimg svg{width:180px;position:relative;z-index:2;transition:transform .5s cubic-bezier(.2,.9,.3,1);filter:drop-shadow(0 16px 26px rgba(0,0,0,.7))}
.ccard:hover .cimg svg{transform:scale(1.1) translateY(-5px)}
.ccard .cinfo{padding:15px 17px 17px;border-top:1px solid var(--line);position:relative;z-index:3}
.ccard .cname{font-family:'Oswald';font-size:17.5px;font-weight:600;text-transform:uppercase;letter-spacing:.045em;display:flex;align-items:center;gap:8px}
.ccard .cname i{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 9px var(--acc);flex-shrink:0}
.ccard .cmeta{display:flex;align-items:center;gap:8px;margin-top:9px}
.ccard .cprice{font-family:'Russo One';font-size:19px;color:var(--gold)}
.ccard .ctopm{margin-left:auto;font-size:10.5px;color:var(--mut2);text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);padding:3px 8px;border-radius:6px;white-space:nowrap;display:flex;align-items:center;gap:5px}
.ccard .ctopm::before{content:'';width:10px;height:10px;background:var(--gold);clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);flex-shrink:0}
.ccard .cbuy{margin-top:13px;width:100%;padding:11px;border-radius:11px;font-family:'Oswald';font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid var(--line2);transition:.25s;pointer-events:none;min-height:40px}
.ccard:hover .cbuy{background:linear-gradient(180deg,#ffd25e,#f0a113);color:#231600;border-color:transparent}
.ccard .rbar{display:flex;gap:2px;margin-top:11px;height:4px;border-radius:3px;overflow:hidden}
.ccard .rbar i{flex:1;border-radius:2px;min-width:1px}

/* Free case row */
.freeRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:18px}
.fcard{position:relative;border-radius:20px;overflow:hidden;padding:20px;cursor:pointer;background:linear-gradient(150deg,rgba(61,220,132,.14),rgba(10,16,26,.9) 55%),linear-gradient(180deg,#151c2a,#101521);border:1px solid rgba(61,220,132,.28);transition:.34s cubic-bezier(.2,.9,.3,1);display:flex;gap:16px;align-items:center;min-height:100%}
.fcard:hover{transform:translateY(-7px);border-color:rgba(61,220,132,.6);box-shadow:0 24px 46px -20px #000,0 0 44px -16px rgba(61,220,132,.85)}
.fcard.wait{border-color:rgba(255,255,255,.09);background:linear-gradient(180deg,#151c2a,#101521)}
.fcard .fimg{width:112px;flex-shrink:0;position:relative;display:grid;place-items:center}
.fcard .fimg .g{position:absolute;width:120px;height:120px;border-radius:50%;filter:blur(26px);opacity:.4;background:var(--acc)}
.fcard .fimg svg{width:104px;position:relative;z-index:2;filter:drop-shadow(0 12px 18px rgba(0,0,0,.7))}
.fcard .fbody{flex:1;min-width:0}
.fcard .ftag{display:inline-block;padding:3px 9px;border-radius:6px;font-family:'Oswald';font-size:10px;letter-spacing:.14em;background:linear-gradient(90deg,#3ddc84,#12a860);color:#00230f;font-weight:600;margin-bottom:7px}
.fcard h3{font-size:19px;text-transform:uppercase;font-weight:600;letter-spacing:.04em}
.fcard .fd{font-size:12px;color:var(--mut);margin:5px 0 10px;line-height:1.35}
.fcard .frow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.fcard .cd{font-family:'Russo One';font-size:15px;padding:5px 11px;border-radius:9px;background:rgba(0,0,0,.45);border:1px solid var(--line)}
.fcard .cd.ok{color:var(--green);border-color:rgba(61,220,132,.45);background:rgba(61,220,132,.12)}
.fcard .cd.wait2{color:var(--cyan)}
.fcard .ev{font-size:11px;color:var(--mut2)}
.fcard .ev b{color:var(--gold);font-family:'Russo One';font-size:13px}

/* Two col with live panel */
.twoCol{display:grid;grid-template-columns:minmax(0,1fr) 328px;gap:22px;align-items:start}
.livePanel{border-radius:18px;background:linear-gradient(180deg,#151c2a,#101521);border:1px solid var(--line);overflow:hidden}
.livePanel .lp-h{display:flex;align-items:center;gap:9px;padding:14px 17px;border-bottom:1px solid var(--line)}
.livePanel .lp-h b{font-family:'Oswald';font-size:13.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:600}
.livePanel .lp-h i{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}
.liveList{max-height:432px;overflow:hidden;padding:8px}
.ldrop{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;animation:ldIn .5s both;margin-bottom:4px;background:rgba(255,255,255,.022);border-left:3px solid var(--rc)}
@keyframes ldIn{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.ldrop .lw{width:52px;height:34px;flex-shrink:0}
.ldrop .lt{flex:1;min-width:0}
.ldrop .lt b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldrop .lt span{font-size:11px;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ldrop .lp{font-family:'Russo One';font-size:12.5px;color:var(--rc);flex-shrink:0}
.pane{background:linear-gradient(180deg,#151c2a,#101521);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--sh)}
.hintList{list-style:none;display:grid;gap:9px}
.hintList li{display:flex;gap:9px;font-size:12.5px;color:var(--mut);align-items:flex-start;line-height:1.4}
.hintList li b{color:var(--green);flex-shrink:0}

/* Hero */
.hero{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(120% 140% at 12% 0%,#12352a 0%,#0b1220 45%,#070a12 100%);padding:42px 46px;display:flex;gap:34px;align-items:center;min-height:280px;box-shadow:var(--sh)}
.hero .hl{flex:1;position:relative;z-index:2;min-width:0}
.hero .tag{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:rgba(61,220,132,.13);border:1px solid rgba(61,220,132,.35);color:#7ff0b0;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;margin-bottom:16px}
.hero .tag i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.hero h1{font-size:clamp(26px,4.2vw,52px);line-height:1.05;font-weight:700;text-transform:uppercase}
.hero h1 em{font-style:normal;background:linear-gradient(96deg,#5cf0a0,#22d3ee 55%,#ffb62e);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{color:var(--mut);font-size:15.5px;max-width:570px;margin:15px 0 22px}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap}
.hero .stats{display:flex;gap:28px;margin-top:28px;flex-wrap:wrap}
.hero .stats div{min-width:84px}
.hero .stats b{display:block;font-family:'Russo One';font-size:22px;color:#fff}
.hero .stats span{font-size:10.5px;color:var(--mut2);text-transform:uppercase;letter-spacing:.13em}
.hero .hr{width:330px;flex-shrink:0;position:relative;z-index:2;display:grid;place-items:center}
.hero .hr .halo{position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(61,220,132,.3),transparent 62%)}
.hero .hr .casefloat{width:244px;position:relative;z-index:2}

/* Modals */
.mask{position:fixed;inset:0;z-index:600;background:rgba(3,5,10,.85);backdrop-filter:blur(9px);display:grid;place-items:center;padding:22px;animation:fadeIn .24s ease both;overflow-y:auto}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{position:relative;width:100%;max-width:940px;border-radius:22px;background:linear-gradient(180deg,#161d2c,#0c1119);border:1px solid var(--line2);box-shadow:0 40px 100px -20px #000;animation:mIn .38s cubic-bezier(.2,1.2,.35,1) both;max-height:92vh;display:flex;flex-direction:column}
@keyframes mIn{from{opacity:0;transform:translateY(34px) scale(.94)}to{opacity:1;transform:none}}
.modal.sm{max-width:480px}.modal.md{max-width:700px}
.mhead{display:flex;align-items:center;gap:14px;padding:19px 24px;border-bottom:1px solid var(--line);flex-shrink:0}
.mhead h3{font-size:19px;text-transform:uppercase;font-weight:600;letter-spacing:.05em}
.mhead .x{margin-left:auto;width:38px;height:38px;border-radius:9px;background:rgba(255,255,255,.06);display:grid;place-items:center;transition:.2s;color:var(--mut);flex-shrink:0;font-size:15px}
.mhead .x:hover{background:var(--red);color:#fff}
.mbody{padding:24px;overflow-y:auto;flex:1}
.mfoot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;flex-shrink:0}

/* Reel */
.omStage{padding:22px 22px 6px;display:flex;flex-direction:column;gap:14px}
.omReels{display:flex;flex-direction:column;gap:12px}
.reelbox{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#0a0e17,#070a11);border:1px solid var(--line);height:172px;contain:strict}
.reelbox::before,.reelbox::after{content:'';position:absolute;top:0;bottom:0;width:110px;z-index:5;pointer-events:none}
.reelbox::before{left:0;background:linear-gradient(90deg,#080b12,transparent)}
.reelbox::after{right:0;background:linear-gradient(270deg,#080b12,transparent)}

/* SVG cache to avoid regenerating identical weapon art */
const SVG_CACHE=new Map();
function weaponSVG(wt,sk){
  const key=wt+'|'+sk;
  let svg=SVG_CACHE.get(key);
  if(svg)return svg;
  const A=ART[wt]||ART.rifle_ak,S=SKINS[sk]||SKINS.sand,id=uid();
  const p=A.vb.split(' ').map(Number),w=p[2],h=p[3];
  const sh=A.shapes.map(d=>`<path d="${d}"/>`).join('');
  const R=seeded(S.n+S.base);let defs='',body='';
  const bg=f=>`<rect x="-10" y="-10" width="${w+20}" height="${h+20}" fill="${f}"/>`;
  switch(S.pat){
    case 'solid':defs+=`<linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${S.c[0]}"/><stop offset=".48" stop-color="${S.base}"/><stop offset="1" stop-color="${S.c[1]}"/></linearGradient>`;body=bg(`url(#g${id})`);break;
    case 'fade':{const st=S.c.length;defs+=`<linearGradient id="g${id}" x1="0" y1="0" x2="1" y2=".35"><stop offset="0" stop-color="${S.base}"/>${S.c.map((c,i)=>`<stop offset="${((i+1)/(st+.6)).toFixed(2)}" stop-color="${c}"/>`).join('')}<stop offset="1" stop-color="${S.base}"/></linearGradient>`;body=bg(`url(#g${id})`);break}
    case 'stripes':defs+=`<pattern id="p${id}" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><rect width="34" height="34" fill="${S.base}"/><rect width="14" height="34" fill="${S.c[0]}"/><rect x="18" width="4" height="34" fill="${S.c[1]}" opacity=".8"/></pattern>`;body=bg(`url(#p${id})`);break;
    case 'camo':{let b='';for(let i=0;i<22;i++){const cx=R()*w,cy=R()*h,rx=8+R()*30,ry=6+R()*20;b+=`<ellipse cx="${cx|0}" cy="${cy|0}" rx="${rx|0}" ry="${ry|0}" fill="${R()>.5?S.c[0]:S.c[1]}" opacity="${(.4+R()*.5).toFixed(2)}" transform="rotate(${(R()*180)|0} ${cx|0} ${cy|0})"/>`}body=bg(S.base)+b;break}
    case 'geo':{let g='';for(let i=0;i<16;i++){const x=R()*w,y=R()*h,s=10+R()*38,col=i%3===0?(S.c[1]||S.c[0]):S.c[0];g+=R()>.45?`<rect x="${x|0}" y="${y|0}" width="${s|0}" height="${(s*.45)|0}" fill="${col}" opacity="${(.35+R()*.5).toFixed(2)}"/>`:`<polygon points="${x|0},${y|0} ${(x+s)|0},${(y+s*.5)|0} ${x|0},${(y+s)|0}" fill="${col}" opacity="${(.3+R()*.5).toFixed(2)}"/>`}defs+=`<linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${S.c[0]}" stop-opacity=".28"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient>`;body=bg(S.base)+g+`<rect x="-10" y="-10" width="${w+20}" height="${h+20}" fill="url(#g${id})"/>`;break}
    case 'marble':{for(let i=0;i<4;i++)defs+=`<radialGradient id="m${id}${i}" cx="${R().toFixed(2)}" cy="${R().toFixed(2)}" r=".75"><stop offset="0" stop-color="${S.c[i%S.c.length]}" stop-opacity=".95"/><stop offset="1" stop-color="${S.c[(i+1)%S.c.length]}" stop-opacity="0"/></radialGradient>`;body=bg(S.base);for(let i=0;i<4;i++)body+=`<rect x="-10" y="-10" width="${w+20}" height="${h+20}" fill="url(#m${id}${i})"/>`;break}
    case 'flame':{let f='';for(let i=0;i<6;i++){const y=R()*h,len=(.35+R()*.6)*w,col=i%2?S.c[0]:(S.c[1]||S.c[0]);f+=`<path d="M${w} ${y|0} C ${(w-len*.6)|0} ${(y-22)|0} ${(w-len*.7)|0} ${(y+26)|0} ${(w-len)|0} ${y|0} C ${(w-len*.66)|0} ${(y+12)|0} ${(w-len*.5)|0} ${(y-8)|0} ${w} ${(y+9)|0} Z" fill="${col}" opacity=".82"/>`}defs+=`<linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${S.base}"/><stop offset="1" stop-color="${S.c[0]}"/></linearGradient>`;body=bg(`url(#g${id})`)+f;break}
    case 'tiger':{let t='';for(let i=0;i<14;i++){const x=R()*w,y=R()*h;t+=`<path d="M${x|0} ${y|0} q ${(10+R()*20)|0} ${(R()*16-8)|0} ${(26+R()*34)|0} ${(R()*10-5)|0} l 0 ${(5+R()*7)|0} q ${(-24-R()*20)|0} ${(R()*10)|0} ${(-28-R()*18)|0} 0 Z" fill="${S.c[0]}" opacity=".9"/>`}defs+=`<linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${S.c[1]||S.base}"/><stop offset=".5" stop-color="${S.base}"/><stop offset="1" stop-color="${S.c[1]||S.base}"/></linearGradient>`;body=bg(`url(#g${id})`)+t;break}
    case 'digital':defs+=`<pattern id="p${id}" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="${S.base}"/><rect width="8" height="8" fill="${S.c[0]}" opacity=".85"/><rect x="8" y="8" width="8" height="8" fill="${S.c[1]||S.c[0]}" opacity=".6"/></pattern>`;body=bg(`url(#p${id})`);break;
    default:body=bg(S.base);
  }
  defs+=`<linearGradient id="s${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/><stop offset=".78" stop-color="#000" stop-opacity=".2"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></linearGradient>`;
  body+=`<rect x="-10" y="-10" width="${w+20}" height="${h+20}" fill="url(#s${id})"/>`;
  svg=`<svg class="wsvg" viewBox="${A.vb}" preserveAspectRatio="xMidYMid meet"><defs><clipPath id="cp${id}">${sh}</clipPath>${defs}</defs><g clip-path="url(#cp${id})">${body}</g><g fill="rgba(0,0,0,.5)" clip-path="url(#cp${id})">${(A.det||[]).map(d=>`<path d="${d}"/>`).join('')}</g><g fill="none" stroke="rgba(0,0,0,.6)" stroke-width="2.4" stroke-linejoin="round">${sh}</g><g fill="none" stroke="rgba(255,255,255,.16)" stroke-width="1" stroke-linejoin="round">${sh}</g></svg>`;
  SVG_CACHE.set(key,svg);
  return svg;
}

  catch(e){return JSON.parse(JSON.stringify(DEF))}}

  save();return o}

const WCD=25*M;
const wheelReady=()=>Date.now()>=State.wheel;
function spinWheel(){
  if(!wheelReady())return toast('Колесо отдыхает','Следующее через '+cdStr(State.wheel-Date.now()),'err');
  State.wheel=Date.now()+WCD;bump('wheel');save();
  const tot=WHEEL.reduce((s,x)=>s+x.w,0);let r=Math.random()*tot,idx=0;
  for(let i=0;i<WHEEL.length;i++){r-=WHEEL[i].w;if(r<=0){idx=i;break}}
  const disc=$('#lwDisc'),prize=WHEEL[idx],sec=360/WHEEL.length;
  const target=360-(idx*sec+sec/2)+rnd(-sec*.3,sec*.3)+6*360;
  let t0=null;const dur=4600;Sound.swoosh();
  (function frame(t){if(!t0)t0=t;const p=clamp((t-t0)/dur,0,1),e=1-Math.pow(1-p,4);
    disc.style.transform=`rotate(${e*target}deg)`;
    if(p<1)requestAnimationFrame(frame);
    else{disc.style.transform=`rotate(${target}deg)`;
      if(prize.v==='tk'){State.tokens++;save();Sound.win(true);toast('🎟️ Жетон!','Откройте любой бесплатный кейс без ожидания','gold')}
      else{earn(prize.v,'Колесо удачи');Sound.win(prize.v>=1000)}
      State.stats.xp+=15;save();setTimeout(render,1400)}})(performance.now())}

function startOpen(c,count){
  Sound.init();
  if(c.free){
    count=1;const avail=State.cd[c.id]||0;
    if(Date.now()<avail){
      if(State.tokens>0){State.tokens--;State.cd[c.id]=0;save();
        toast('🎟️ Жетон использован','Кулдаун «'+c.name+'» сброшен','ok');Sound.coin()}
      else return toast('Кейс ещё не готов','Следующий через '+cdStr(avail-Date.now()),'err')}
    State.cd[c.id]=Date.now()+c.cd;State.stats.free++;bump('free')
  }else{
    const total=c.price*count;
    if(State.balance<total){Sound.lose();return UI.noMoney(c)}
    State.balance-=total;State.stats.spent+=total}
  State.stats.opened+=count;State.stats.xp+=count*(c.free?8:14);save();updateBal(true);
  const results=[];for(let i=0;i<count;i++)results.push(rollItem(c));
  closeModal(true);
  showOpenAnimation(c,results);
}

function showOpenAnimation(c,results){
  const fast=State.fast,total=results.reduce((s,i)=>s+i.price,0),multi=results.length>1;
  const m=modal(`<div class="mhead"><h3 style="color:${c.acc}">${c.name}</h3>
    <span style="font-size:11.5px;color:var(--mut2);margin-left:auto">${c.free?'бесплатно':'x'+results.length}</span>
    <button class="x" onclick="closeModal()">✕</button></div>
    <div class="omStage">${fast?'':`<div class="omReels">${results.map((r,i)=>`<div class="reelbox" data-i="${i}" ${multi?'style="height:140px"':''}><div class="reel-track"></div><div class="marker"></div></div>`).join('')}</div>`}</div>
    <div class="resGrid c${results.length}" id="resGrid" style="${fast?'':'display:none'}"></div>
    <div class="omSum" id="omSum" style="display:none">Общая стоимость дропа <b>${fmt(total)}</b></div>
    <div class="mfoot" id="omFoot" style="display:none">
      <button class="btn btn-gh" onclick="closeModal()">Закрыть</button>
      <button class="btn btn-gr" id="sellAll">💰 Продать · ${fmt(total)}</button>
      <button class="btn btn-gold" id="keepAll">🎒 В инвентарь</button>
      ${!c.free?`<button class="btn btn-cy" id="againBtn">🔁 Ещё</button>`:''}
    </div>`,'md');
  const root=m.querySelector('.modal');root.style.maxWidth=multi?'1000px':'700px';
  let resolved=false;
  function finish(){
    if(resolved)return;resolved=true;
    const grid=$('#resGrid');
    /* Build with DocumentFragment for speed */
    const frag=document.createDocumentFragment();
    results.forEach((it,i)=>{
      const div=document.createElement('div');
      div.className='rcard'+(it.rar==='gold'?' gold':'');
      div.style.setProperty('--i',i);
      div.style.setProperty('--rc',RAR[it.rar].c);
      div.innerHTML=`<div class="rgl"></div><div class="rimg">${weaponSVG(it.wt,it.sk)}</div>
        <div class="rtxt"><div class="rrar">${RAR[it.rar].n}</div><div class="rnm">${it.name}</div>
        <div class="rpr" style="color:${RAR[it.rar].c}">${fmt(it.price)}</div></div>`;
      frag.appendChild(div);
    });
    grid.appendChild(frag);
    grid.style.display='';$('#omSum').style.display='';$('#omFoot').style.display='';
    const best=results.reduce((a,b)=>b.price>a.price?b:a);
    const objs=results.map(it=>addInv(it,c.free?'Бесплатный кейс':c.name));
    let soldSum=0;
    if(autoSell)objs.forEach(o=>{const it=ITEM(o.id);
      if(it&&(it.rar==='consumer'||it.rar==='industrial')){o.st='sold';soldSum+=it.price;bump('sold')}});
    if(soldSum){State.balance+=soldSum;State.stats.earned+=soldSum;toast('Авто-продажа','+'+fmt(soldSum)+' за серый/промышленный дроп','coin')}
    save();updateBal(true);
    setTimeout(()=>{
      if(best.rar==='gold'){Sound.win(true);toast('🏆 НЕВЕРОЯТНО!','Вы выбили '+best.name,'gold')}
      else if(best.rar==='covert'){Sound.win(true);toast('🔥 Тайное!','Выпал '+best.name,'gold')}
      else if(best.rar==='classified'){Sound.win(true)}
      else Sound.win(false);
      Live.push({item:best,user:State.name,case:c.name})},260);
    $('#keepAll').onclick=()=>{Sound.coin();toast('Забрано','Предметы в инвентаре','ok');closeModal();refreshBonusDot()};
    $('#sellAll').onclick=()=>{let s=0;objs.forEach(o=>{if(o.st==='in')s+=sellItem(o)});
      if(s)toast('Продано','+'+fmt(s)+' на баланс','coin');else toast('Уже продано','Авто-продажа сработала','info');
      Sound.coin();closeModal();refreshBonusDot()};
    const ab=$('#againBtn');
    if(ab)ab.onclick=()=>{closeModal();setTimeout(()=>{
      if(c.free){const av=State.cd[c.id]||0;if(Date.now()<av){toast('Подождите','Кейс будет готов через '+cdStr(av-Date.now()),'err');return}}
      startOpen(c,results.length)},200)};
  }
  if(fast){setTimeout(finish,120);return}
  /* Animated reels */
  const TOTAL=52,WIN=42;
  const boxes=$$('.reelbox',root);
  /* Pre-populate tracks via DocumentFragment */
  boxes.forEach((box,i)=>{
    const track=box.querySelector('.reel-track');
    const frag=document.createDocumentFragment();
    for(let k=0;k<TOTAL;k++){
      const it=k===WIN?results[i]:ITEM(pick(c.items));
      const div=document.createElement('div');
      div.className='ritem';
      div.style.setProperty('--rc',RAR[it.rar].c);
      div.innerHTML=`<div class="rglow"></div>${weaponSVG(it.wt,it.sk)}<div class="rname">${it.name}</div>`;
      frag.appendChild(div);
    }
    track.appendChild(frag);
  });
  requestAnimationFrame(()=>{
    let done=0;
    boxes.forEach((box,i)=>{
      const track=box.querySelector('.reel-track');
      const firstItem=track.firstElementChild;
      if(!firstItem){done++;return}
      const gap=9;
      const iw=firstItem.offsetWidth+gap;
      const bw=box.offsetWidth;
      const jitter=rnd(-iw*0.26,iw*0.26);
      const target=WIN*iw+iw/2-bw/2+jitter;
      const dur=(DEV.mode==='mobile'?3800:5200)+i*420;
      let lastIdx=-1,t0=null;
      const ease=p=>1-Math.pow(1-p,5);
      (function frame(t){
        if(!t0)t0=t;
        const p=clamp((t-t0)/dur,0,1);
        const pos=ease(p)*target;
        track.style.transform=`translate3d(${-pos}px,0,0)`;
        const idx=Math.floor(pos/iw);
        if(idx!==lastIdx&&idx>=0&&p<0.965){lastIdx=idx;Sound.tick()}
        if(p<1){requestAnimationFrame(frame)}
        else{
          track.style.transform=`translate3d(${-target}px,0,0)`;
          const winEl=track.children[WIN];if(winEl)winEl.classList.add('hit');
          box.style.boxShadow=`0 0 40px -8px ${RAR[results[i].rar].c}`;
          Sound.tone(680,.13,'triangle',.055);
          done++;
          if(done===boxes.length)setTimeout(finish,420);
        }
      })(performance.now());
    });
  });
}

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:9px">
        ${QUESTS.map(q=>{const v=Math.min(qVal(q),q.t),p=v/q.t,done=State.claimed[q.id],can=!done&&v>=q.t;
        return `<div style="display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:13px;background:rgba(255,255,255,.032);border:1px solid var(--line);${done?'opacity:.45':''}">
          <div style="width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.06);flex-shrink:0">${q.ic}</div>
          <div style="flex:1;min-width:0">

            <div style="height:5px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:6px"><i style="display:block;height:100%;width:${p*100}%;background:linear-gradient(90deg,var(--green),var(--cyan))"></i></div>
          </div>
          <div style="text-align:right;flex-shrink:0">

            ${done?`<button class="btn btn-gh sm" disabled>Готово</button>`
            :can?`<button class="btn btn-gr sm" data-claim="${q.id}">Забрать</button>`

function InitBonus(){
  const sb=$('#spinBtn');if(sb)sb.onclick=spinWheel;
  const db=$('#dailyBtn');if(db)db.onclick=claimDaily;
  const pb=$('#promoBtn'),pi=$('#promoIn');
  if(pb)pb.onclick=()=>applyPromo(pi.value);
  if(pi)pi.addEventListener('keydown',e=>{if(e.key==='Enter'){applyPromo(pi.value);pi.blur()}});
  $$('[data-claim]').forEach(b=>b.onclick=()=>{claimQuest(b.dataset.claim);Sound.win(false)});
  $$('[data-open]').forEach(el=>el.onclick=()=>openCaseModal(el.dataset.open));
}

/* ============ INVENTORY ============ */
let invFilter='all',invSort='new';
function PageInventory(){
  let list=State.inv.slice();const active=list.filter(o=>o.st==='in');
  if(invFilter==='in')list=active;else if(invFilter!=='all')list=list.filter(o=>ITEM(o.id)&&ITEM(o.id).rar===invFilter);
  if(invSort==='priceD')list.sort((a,b)=>(ITEM(b.id)?.price||0)-(ITEM(a.id)?.price||0));
  if(invSort==='priceA')list.sort((a,b)=>(ITEM(a.id)?.price||0)-(ITEM(b.id)?.price||0));
  if(invSort==='rar')list.sort((a,b)=>(RAR[ITEM(b.id)?.rar]?.o||0)-(RAR[ITEM(a.id)?.rar]?.o||0));
  const total=active.reduce((s,o)=>s+(ITEM(o.id)?.price||0),0);
  return `<div class="sechead" style="margin-top:6px"><h2>Инвентарь</h2><p>${active.length} активных на ${fmt(total)}</p>
    <div class="sp" style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-gr sm" id="sellAllInv">💰 Продать всё</button>
      <button class="btn btn-gh sm" onclick="go('bonus')">🎁 Бонусы</button></div></div>
  <div class="toolbar">
    <button class="chip ${invFilter==='all'?'on':''}" data-if="all">Все (${State.inv.length})</button>
    <button class="chip ${invFilter==='in'?'on':''}" data-if="in">Активные (${active.length})</button>
    ${RORDER.map(r=>{const n=State.inv.filter(o=>ITEM(o.id)&&ITEM(o.id).rar===r).length;return n?
      `<button class="chip ${invFilter===r?'on':''}" data-if="${r}" ${invFilter===r?`style="border-color:${RAR[r].c};color:${RAR[r].c}"`:''}>${RAR[r].n} (${n})</button>`:''}).join('')}
    <select class="sel" id="invSort" style="margin-left:auto">
      <option value="new" ${invSort==='new'?'selected':''}>Новые</option>
      <option value="priceD" ${invSort==='priceD'?'selected':''}>Дорогие</option>
      <option value="priceA" ${invSort==='priceA'?'selected':''}>Дешёвые</option>
      <option value="rar" ${invSort==='rar'?'selected':''}>По редкости</option></select></div>
  ${list.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:16px">
    ${list.map((o,i)=>{const it=ITEM(o.id);if(!it)return'';const gone=o.st!=='in';
    return `<div class="reveal" style="--i:${Math.min(i,24)};--rc:${RAR[it.rar].c};position:relative;border-radius:15px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.35));border:1px solid var(--line);border-top:3px solid var(--rc);${gone?'opacity:.35;filter:grayscale(1)':''}">
      ${gone?`<div style="position:absolute;top:8px;right:8px;z-index:4;padding:3px 8px;border-radius:6px;font-family:'Oswald';font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.7);border:1px solid var(--line2)">${{sold:'Продано',upgraded:'Апгрейд',lost:'Потерян',contract:'Контракт',traded:'Обмен',trade_pending:'В обмене'}[o.st]||o.st}</div>`:''}
      <div style="height:104px;display:grid;place-items:center;padding:12px;background:radial-gradient(62% 62% at 50% 52%,color-mix(in srgb,var(--rc) 20%,transparent),transparent 72%)">${weaponSVG(it.wt,it.sk)}</div>
      <div style="padding:0 12px;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--rc);font-family:'Oswald';font-weight:600">${RAR[it.rar].n}</div>
      <div style="padding:4px 12px 0;font-size:12.5px;font-weight:600;line-height:1.3;min-height:38px">${it.name}</div>
      <div style="padding:2px 12px 0;font-family:'Russo One';font-size:14px;color:${RAR[it.rar].c}">${fmt(it.price)}</div>
      <div style="display:flex;gap:6px;padding:11px 12px 13px">
        ${gone?`<button style="flex:1;padding:10px;opacity:.4;border:1px solid var(--line2);background:rgba(255,255,255,.05);border-radius:9px">—</button>`
        :`<button style="flex:1;padding:10px 6px;border-radius:9px;font-family:'Oswald';font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--line2);background:rgba(255,255,255,.05)" data-sell="${o.uid}">Продать</button>`}</div>
      </div>`}).join('')}
  </div>`:`<div style="padding:60px 20px;text-align:center;color:var(--mut2)"><b style="display:block;font-family:'Oswald';font-size:19px;color:var(--mut);text-transform:uppercase;margin-bottom:7px">Инвентарь пуст</b>Откройте бесплатный кейс — предметы появятся здесь
    <button class="btn btn-gr" style="margin-top:18px" onclick="go('bonus')">🎁 Открыть бесплатно</button></div>`}`}

function InitInventory(){
  $$('[data-if]').forEach(b=>b.onclick=()=>{invFilter=b.dataset.if;Sound.click();render()});
  const s=$('#invSort');if(s)s.onchange=e=>{invSort=e.target.value;render()};
  $$('[data-sell]').forEach(b=>b.onclick=()=>{const o=State.inv.find(x=>x.uid===b.dataset.sell);if(!o)return;
    const p=sellItem(o);Sound.coin();toast('Продано','+'+fmt(p)+' на баланс','coin');render()});
  const sa=$('#sellAllInv');
  if(sa)sa.onclick=()=>{let s=0,n=0;State.inv.forEach(o=>{if(o.st==='in'){s+=sellItem(o);n++}});
    if(!n)return toast('Пусто','Нечего продавать','err');
    Sound.coin();toast('Продано всё','+'+fmt(s)+' · предметов: '+n,'coin');render()}}

/* ============ PROFILE ============ */
function PageProfile(){
  const s=State.stats,lv=level(s.xp),prog=((Math.sqrt(s.xp/200))-(lv-1))*100;
  const inv=State.inv.filter(o=>o.st==='in'),invVal=inv.reduce((a,o)=>a+(ITEM(o.id)?.price||0),0);
  const devName=DEV.mode==='mobile'?'📱 Смартфон':DEV.mode==='tablet'?'📱 Планшет':'🖥 Десктоп';
  return `<div style="display:flex;gap:22px;align-items:center;padding:26px;border-radius:20px;background:linear-gradient(120deg,#132a22,#0d1220 60%);border:1px solid var(--line);flex-wrap:wrap;position:relative;overflow:hidden">
    <div style="width:96px;height:96px;border-radius:22px;background:conic-gradient(from 200deg,#3ddc84,#22d3ee,#ffb62e,#3ddc84);padding:3px;flex-shrink:0">
      <div style="width:100%;height:100%;border-radius:19px;background:#0c111c;display:grid;place-items:center;font-family:'Russo One';font-size:34px">${(State.name||'Q')[0].toUpperCase()}</div></div>
    <div style="flex:1;min-width:200px">
      <h2 style="font-size:27px;text-transform:uppercase;font-weight:600">${State.name}</h2>
      <div style="display:flex;align-items:center;gap:11px;margin-top:7px">
        <b style="font-family:'Russo One';font-size:14px;color:var(--gold);flex-shrink:0">Ур. ${lv}</b>
        <div style="height:7px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;flex:1;min-width:90px;max-width:280px"><i style="display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#3ddc84,#22d3ee);width:${clamp(prog,2,100)}%"></i></div>
        <span style="font-size:11.5px;color:var(--mut2)">${fmtN(s.xp)} XP</span></div>
      <div style="margin-top:9px;font-size:12.5px;color:var(--mut)">🚫 Донат отключён · бонус 3 000 ₽ ${State.welcome?'получен ✔':'не получен'} · ${devName} · ${token?'☁️ серверное сохранение':'⚠️ не авторизован'}</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;width:100%">
      <button class="btn btn-gr" style="flex:1" onclick="go('bonus')">🎁 Бонусы</button>
      <button class="btn btn-gh" style="flex:1" onclick="doReset()">Сброс</button>
      <button class="btn btn-gh" style="flex:1" onclick="logout()">🚪 Выйти</button></div>
  </div>
  <div class="sechead"><h2>Статистика</h2></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:15px">
    ${[['Стартовый бонус',fmt(START_BALANCE),State.welcome?'зачислен':'доступен','#ffb62e'],
      ['Кейсов открыто',fmtN(s.opened),'бесплатных: '+fmtN(s.free),'#22d3ee'],
      ['Заработано',fmt(s.earned),'бонусы + продажи','#3ddc84'],
      ['Потрачено',fmt(s.spent),'только заработанные ₽','#ff4d5e'],
      ['Стоимость дропа',fmt(s.won),'всего выбито','#a3e635'],
      ['Лучший дроп',fmt(s.best),'максимальная цена','#ffd700'],
      ['Инвентарь',fmt(invVal),inv.length+' активных','#d32ce6'],
      ['Жетоны',String(State.tokens),'сброс кулдауна','#22d3ee'],
      ['Апгрейды',s.upW+' / '+s.upL,'побед / поражений','#ff2fb9'],
      ['Контракты',fmtN(s.ct),'заключено','#8847ff'],
      ['Серия дней',State.daily.streak+'/7','ежедневный бонус','#9fb2c8'],
      ['Рентабельность',(s.spent?(s.won/s.spent*100).toFixed(1):'0')+'%','возврат средств','#5e98d9']]
    .map(([l,v,ss,c],i)=>`<div class="reveal" style="--i:${i};border-radius:16px;padding:19px;background:linear-gradient(180deg,#151c2a,#101521);border:1px solid var(--line);position:relative;overflow:hidden">
      <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:${c};box-shadow:0 0 16px ${c}"></div>
      <div style="font-size:11px;color:var(--mut2);text-transform:uppercase;letter-spacing:.13em;font-family:'Oswald';font-weight:500">${l}</div>
      <div style="font-family:'Russo One';font-size:24px;margin-top:7px;color:#fff;word-break:break-word">${v}</div>
      <div style="font-size:11.5px;color:var(--mut);margin-top:2px">${ss}</div></div>`).join('')}
  </div>`}

function doReset(){
  modal(`<div class="mhead"><h3>Сброс прогресса</h3><button class="x" onclick="closeModal()">✕</button></div>
    <div class="mbody"><p style="color:var(--mut)">Баланс, инвентарь, задания, серия и кулдауны будут обнулены. Вы снова начнёте со стартовым бонусом <b style="color:var(--gold)">3 000 ₽</b>.</p></div>
    <div class="mfoot"><button class="btn btn-gh" onclick="closeModal()">Отмена</button>
    <button class="btn btn-red" onclick="closeModal();doResetNow()">Сбросить</button></div>`,'sm')}
async function doResetNow(){
  State=JSON.parse(JSON.stringify(DEF));State.syncTs=Date.now();
  try{localStorage.setItem('cf6_state',JSON.stringify(State))}catch(e){}
  if(token){try{await api('/api/state',State)}catch(e){}}
  location.reload();
}
function logout(){token=null;localStorage.removeItem('cf_token');location.reload()}

/* ============ ROUTER ============ */
function render(){
  const app=$('#app');if(!app)return;
  $$('#nav button,#mobnav button').forEach(b=>b.classList.toggle('on',b.dataset.p===curPage));
  let html='';
  if(curPage==='home')html=PageHome();
  else if(curPage==='bonus')html=PageBonus();
  else if(curPage==='inventory')html=PageInventory();
  else if(curPage==='profile')html=PageProfile();
  else html=PageHome();
  app.innerHTML=`<div class="page">${html}</div>`;
  if(curPage==='home')InitHome();
  else if(curPage==='bonus')InitBonus();
  else if(curPage==='inventory')InitInventory();
  updateBal();refreshBonusDot();Live.renderPanel();tickCD();
}

/* ============ CD TICK ============ */
function tickCD(){
  FREE.forEach(c=>{const left=(State.cd[c.id]||0)-Date.now(),ready=left<=0;
    $$(`[data-cd="${c.id}"]`).forEach(el=>{el.textContent=ready?'✔ ДОСТУПЕН':cdStr(left);
      el.classList.toggle('ok',ready);el.classList.toggle('wait2',!ready)})});
  const w=$('#lwCd');if(w){const r=wheelReady();w.textContent=r?'GO':cdStr(State.wheel-Date.now());
    const sb=$('#spinBtn');
    if(sb){sb.disabled=!r;sb.className='btn '+(r?'btn-gold':'btn-gh');sb.textContent=r?'🎡 Крутить бесплатно':'⏳ '+cdStr(State.wheel-Date.now())}}
  refreshBonusDot();
}
setInterval(tickCD,1000);

/* ============ SERVER / AUTH ============ */
let token=localStorage.getItem('cf_token')||null;
async function api(path,body){
  const res=await fetch(path,{method:body?'POST':'GET',
    headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},
    body:body?JSON.stringify(body):undefined});
  if(res.status===401){token=null;localStorage.removeItem('cf_token');showAuth('login');throw new Error('Требуется вход')}
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.detail||'Ошибка сервера')}
  return res.json()}

function showAuth(mode='login'){
  closeModal(true);
  const isLogin=mode==='login';
  const m=modal(`<div class="mhead"><h3>${isLogin?'🔑 Вход':'📝 Регистрация'}</h3>
    <span style="font-size:11px;color:var(--mut2);margin-left:auto">CASEFORGE · аккаунт</span></div>
    <div class="mbody" style="display:grid;gap:11px">
    <input id="aNick" placeholder="Ник" autocomplete="username" style="padding:12px 15px;border-radius:11px;background:rgba(0,0,0,.35);border:1px solid var(--line2);color:#fff;font-size:16px;outline:none">
    <input id="aPass" type="password" placeholder="Пароль" autocomplete="current-password" style="padding:12px 15px;border-radius:11px;background:rgba(0,0,0,.35);border:1px solid var(--line2);color:#fff;font-size:16px;outline:none">
    <div id="aErr" style="color:var(--red);font-size:13px;min-height:16px"></div></div>
    <div class="mfoot">
    <button class="btn btn-gh" id="aSwap">${isLogin?'Нет аккаунта? Регистрация':'Уже есть аккаунт? Вход'}</button>
    <button class="btn btn-gold" id="aGo">${isLogin?'Войти':'Создать аккаунт'}</button></div>`,'sm');
  m.querySelector('.modal').dataset.lock='1';
  $('#aSwap').onclick=()=>{Sound.click();showAuth(isLogin?'reg':'login')};
  const submit=async()=>{
    const nick=$('#aNick').value.trim(),pass=$('#aPass').value;
    if(!nick||!pass){$('#aErr').textContent='Заполни оба поля';return}
    $('#aGo').disabled=true;$('#aErr').textContent='';
    try{
      const r=await api('/api/'+(isLogin?'login':'register'),{nick,password:pass});
      token=r.token;localStorage.setItem('cf_token',token);
      closeModal(true);
      await bootRemote();afterBoot();
      api('/api/ping',{ok:1}).catch(()=>{});
      toast(isLogin?'✅ С возвращением':'✅ Аккаунт создан',r.nick,'ok');
    }catch(e){$('#aErr').textContent=e.message||'Ошибка';$('#aGo').disabled=false}
  };
  $('#aGo').onclick=submit;
  $('#aPass').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
  $('#aNick').addEventListener('keydown',e=>{if(e.key==='Enter')$('#aPass').focus()});
}

async function bootRemote(){
  let st=null;
  for(let i=0;i<3&&!st;i++){
    try{st=await api('/api/state')}
    catch(e){st=null;if(/вход/i.test(e.message||''))throw e;if(i<2)await new Promise(r=>setTimeout(r,1200))}
  }
  const local=loadLocal();
  if(st){
    if((st.syncTs||0)>=(local.syncTs||0))State=Object.assign(JSON.parse(JSON.stringify(DEF)),st);
    else{State=Object.assign(JSON.parse(JSON.stringify(DEF)),local);pushState()}
  }else{
    State=Object.assign(JSON.parse(JSON.stringify(DEF)),local);_offline=true;
    toast('⚠️ Нет связи с сервером','Прогресс синхронизируется, когда сеть появится','err');
  }
  window._srvTs=Date.now()/1000;balShown=0;_booted=true;
}

/* ============ BOOT ============ */
buildNav();
const sndIcon=on=>on?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>'
  :'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>';
Sound.on=State.sound!==false;
$('#sndBtn').innerHTML=sndIcon(Sound.on);
$('#sndBtn').classList.toggle('act',Sound.on);
$('#sndBtn').onclick=()=>{Sound.on=!Sound.on;State.sound=Sound.on;save();
  $('#sndBtn').classList.toggle('act',Sound.on);$('#sndBtn').innerHTML=sndIcon(Sound.on);if(Sound.on)Sound.click()};
$('#avatarLtr').textContent=(State.name||'Q')[0].toUpperCase();

function afterBoot(){
  const firstVisit=!State.welcome;
  render();
  $('#avatarLtr').textContent=(State.name||'Q')[0].toUpperCase();
  checkQuests();
  if(firstVisit){State.welcome=true;State.balance=START_BALANCE;save();balShown=0;
    setTimeout(()=>{toast('🎉 Добро пожаловать!','Стартовый бонус 3 000 ₽ зачислен','gold');Sound.fanfare()},500)}
  else updateBal();
  setTimeout(()=>{if(bonusCount())toast('🎁 Есть бесплатные бонусы','Колесо удачи, серия и кейсы готовы','gold')},1800);
}

/* Fast periodic live drop tick — no reflow-heavy ops */
setInterval(()=>{const d=Live.gen();if(d.item.price>1500){Live.push(d)}else{Live.items.unshift(d);if(Live.items.length>30)Live.items.pop()}},5000);

document.addEventListener('click',()=>Sound.init(),{once:true});
document.addEventListener('touchstart',()=>Sound.init(),{once:true,passive:true});

if(token){
  bootRemote().then(afterBoot).catch(()=>{render();showAuth('login')});
  api('/api/ping',{ok:1}).catch(()=>{});
}else{
  render();
  showAuth('login');
}

/* Expose for inline handlers */
window.go=go;window.render=render;window.closeModal=closeModal;window.openCaseModal=openCaseModal;
window.doReset=doReset;window.doResetNow=doResetNow;window.logout=logout;window.showAuth=showAuth;
window.Sound=Sound;window.State=State;window.UI=UI;window.spinWheel=spinWheel;window.claimDaily=claimDaily;
window.applyPromo=applyPromo;window.claimQuest=claimQuest;
</script>
